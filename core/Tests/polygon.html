<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон движения</title>
<!-- Шаблон полигона (Г55). Данные подставляет dotnet run --project Tests -- polygon → core/polygon/polygon.html -->
<style>
:root{
  --bg:#f4f1e8; --panel:#fbfaf5; --ink:#24221d; --muted:#6b675c; --line:#d9d3c2; --accent:#8a5a1f; --chip:#ece6d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
body{ display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header{ display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1{ font-size:16px; margin:0 8px 0 0; font-weight:650; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
button{ font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
button.on{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
main{ display:grid; grid-template-columns:1fr 340px; min-height:0; }
#wrap{ position:relative; min-width:0; min-height:0; }
canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
canvas.drag{ cursor:grabbing; }
aside{ border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; }
aside h2{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
.note{ color:var(--muted); margin:0; }
.unit{ display:grid; grid-template-columns:14px 1fr; gap:2px 8px; padding:6px; border-radius:6px; cursor:pointer; }
.unit:hover{ background:var(--chip); }
.unit.sel{ outline:1px solid var(--accent); }
.sw{ width:12px; height:12px; border-radius:3px; margin-top:3px; }
.unit small{ grid-column:2; color:var(--muted); }
label{ display:flex; gap:6px; align-items:center; margin:3px 0; }
.log p{ margin:0 0 4px; font-size:13px; }
.log b{ color:var(--accent); font-weight:600; }
footer{ display:flex; gap:10px; align-items:center; padding:8px 16px; border-top:1px solid var(--line); }
#time{ min-width:120px; font-variant-numeric:tabular-nums; }
#slider{ flex:1; accent-color:var(--accent); }
.hint{ position:absolute; left:10px; bottom:8px; color:var(--muted); font-size:12px; background:var(--panel); padding:2px 6px; border-radius:4px; opacity:.85; }
@media (max-width:760px){
  main{ grid-template-columns:1fr; grid-template-rows:55vh auto; }
  aside{ border-left:none; border-top:1px solid var(--line); }
  footer{ flex-wrap:wrap; }
}
</style>
</head>
<body>
<header>
  <h1>Полигон движения</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div class="hint">колесо — приближение · тянуть — сдвиг · двойной щелчок — вся карта · пробел — пауза</div></div>
  <aside>
    <p class="note" id="note"></p>
    <h2>Отряды</h2><div id="units"></div>
    <h2>Показать</h2>
    <label><input type="checkbox" id="showRoute" checked> путь и цель</label>
    <label><input type="checkbox" id="showFlow"> карта направлений выбранного отряда</label>
    <label><input type="checkbox" id="showSlots"> места в строю</label>
    <h2>Журнал</h2><div class="log" id="log"></div>
    <p class="note" id="made"></p>
  </aside>
</main>
<footer>
  <button id="play">▶</button>
  <button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  <span id="time"></span>
  <input type="range" id="slider" min="0" value="0" step="1">
</footer>
<script>
const DATA = /*DATA*/null;
const COLORS = ["#c0392b", "#2c6fbb", "#2e8b57", "#b8860b", "#7d3c98", "#d35400"];
// местность: коды как в Terrain.cs
const TERRAIN = {0:"#e9e4d4",1:"#e9e4d4",2:"#cdb68a",3:"#e8d49a",4:"#f4f6f8",5:"#b9c79a",6:"#7f9d6a",7:"#7fa6c9",8:"#a9c4dc",9:"#a0896a",
  10:"#8fa58c",11:"#9a958c",12:"#6d665e",13:"#8b6d4a",14:"#5c554e",15:"#8b6d4a",16:"#6f8fa8",17:"#a08f6e",18:"#7c6f63",19:"#c9c2b2",20:"#b0a48f"};
const DX = [-1,0,1,-1,1,-1,0,1], DY = [-1,-1,-1,0,0,1,1,1];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, sel = 0, frame = 0, playing = false, speed = 1, view = null, terrainImg = null;

function decode(str, n){
  const out = new Uint8Array(n); let p = 0;
  if(!str) return out;
  for(const run of str.split(",")){ const [v, c] = run.split(".").map(x => parseInt(x, 36)); out.fill(v, p, p + c); p += c; }
  return out;
}
function bakeTerrain(){
  const k = 4, c = document.createElement("canvas"); c.width = S.cols * k; c.height = S.rows * k;
  const g = c.getContext("2d"), t = decode(S.t, S.cols * S.rows), z = decode(S.z, S.cols * S.rows);
  for(let y = 0; y < S.rows; y++) for(let x = 0; x < S.cols; x++){
    const i = y * S.cols + x;
    g.fillStyle = TERRAIN[t[i]] || "#e9e4d4"; g.fillRect(x * k, y * k, k, k);
    if(z[i]){ g.fillStyle = `rgba(120,80,30,${0.07 * z[i]})`; g.fillRect(x * k, y * k, k, k); }
  }
  // горизонтали: граница уровней высоты
  g.fillStyle = "rgba(90,60,25,.55)";
  for(let y = 0; y < S.rows; y++) for(let x = 0; x < S.cols; x++){
    const i = y * S.cols + x;
    if(x + 1 < S.cols && z[i] !== z[i + 1]) g.fillRect((x + 1) * k - 0.5, y * k, 1, k);
    if(y + 1 < S.rows && z[i] !== z[i + S.cols]) g.fillRect(x * k, (y + 1) * k - 0.5, k, 1);
  }
  terrainImg = c;
}

function fit(){
  const r = cv.getBoundingClientRect(), pad = 16;
  const s = Math.min((r.width - 2 * pad) / S.w, (r.height - 2 * pad) / S.h);
  view = {s, ox: (r.width - S.w * s) / 2, oy: (r.height - S.h * s) / 2};
}
const X = x => view.ox + x * view.s, Y = y => view.oy + y * view.s;

function lerpFrame(f){
  const i = Math.floor(f), a = S.frames[i], b = S.frames[Math.min(i + 1, S.frames.length - 1)], k = f - i;
  return a.map((ua, u) => ua.map((v, j) => {
    if(j === 2){ let d = ((b[u][2] - v + 540) % 360) - 180; return v + d * k; }
    return v + (b[u][j] - v) * k;
  }));
}

function draw(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)){ cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(terrainImg, X(0), Y(0), S.w * view.s, S.h * view.s);
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.strokeRect(X(0), Y(0), S.w * view.s, S.h * view.s);
  const fr = lerpFrame(frame);

  if($("showFlow").checked) drawFlow(S.units[sel]);
  S.units.forEach((u, i) => {
    const col = COLORS[i % COLORS.length];
    if($("showRoute").checked && u.route){
      ctx.setLineDash([6, 5]); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
      u.route.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke(); ctx.setLineDash([]);
      const [tx, ty, tf] = u.order, a = tf * Math.PI / 180;
      ctx.beginPath(); ctx.arc(X(tx), Y(ty), 4, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(tx), Y(ty)); ctx.lineTo(X(tx + Math.sin(a) * 25), Y(ty - Math.cos(a) * 25)); ctx.stroke();
    }
    const f = fr[i], h = f[2] * Math.PI / 180;
    if($("showSlots").checked) drawSlots(u, f, col);
    ctx.fillStyle = col; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 0.6;
    u.figs.forEach(([w, d], k) => {
      const x = X(f[4 + 2 * k]), y = Y(f[5 + 2 * k]);
      ctx.save(); ctx.translate(x, y); ctx.rotate(h);
      const W = Math.max(1.2, w * view.s), D = Math.max(1, d * view.s);
      ctx.fillRect(-W / 2, -D / 2, W, D); if(view.s > 2) ctx.strokeRect(-W / 2, -D / 2, W, D);
      ctx.restore();
    });
    // центр строя и курс
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(X(f[0]), Y(f[1])); ctx.lineTo(X(f[0] + Math.sin(h) * (u.depth / 2 + 14)), Y(f[1] - Math.cos(h) * (u.depth / 2 + 14))); ctx.stroke();
    // карта всегда «бумажная» — подпись тёмная со светлой обводкой в любой теме
    const lx = X(f[0]) + 8, ly = Y(f[1]) + u.depth / 2 * view.s + 16;
    ctx.font = "600 12px system-ui"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,253,245,.9)"; ctx.lineWidth = 3; ctx.strokeText(u.name, lx, ly);
    ctx.fillStyle = "#1d1b16"; ctx.fillText(u.name, lx, ly);
  });
  const time = frame * S.dt, turn = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9) + 1), tin = time - (turn - 1) * S.turnSec;
  $("time").textContent = `ход ${turn} · ${tin.toFixed(1).replace(".", ",")} с`;
  $("slider").value = Math.round(frame);
  showLog(time);
  showUnits(fr);
}

function drawFlow(u){
  if(!u || !u.flow) return;
  const cw = S.w / S.cols, ch = S.h / S.rows, step = Math.max(1, Math.round(16 / (cw * view.s)));
  ctx.strokeStyle = "rgba(30,30,30,.45)"; ctx.lineWidth = 1;
  for(let y = Math.floor(step / 2); y < S.rows; y += step) for(let x = Math.floor(step / 2); x < S.cols; x += step){
    const c = u.flow[y * S.cols + x];
    if(c === "." || c === "T") continue;
    const k = c.charCodeAt(0) - 48, dx = DX[k], dy = DY[k], l = Math.hypot(dx * cw, dy * ch);
    const cx = X((x + 0.5) * cw), cy = Y((y + 0.5) * ch), L = Math.min(7, step * cw * view.s * 0.4), ux = dx * cw / l, uy = dy * ch / l;
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
    ctx.lineTo(cx + ux * L - (ux * 3 - uy * 2.5), cy + uy * L - (uy * 3 + ux * 2.5));
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - (ux * 3 + uy * 2.5), cy + uy * L - (uy * 3 - ux * 2.5));
    ctx.stroke();
  }
}

// места в строю: по раскладке фигурок вокруг центра (сетка, как Formation.Layout) — пунктирный контур строя
function drawSlots(u, f, col){
  const h = f[2] * Math.PI / 180, c = Math.cos(h), s = Math.sin(h), fw = u.front / 2, dd = u.depth / 2;
  const pts = [[-fw, -dd], [fw, -dd], [fw, dd], [-fw, dd]].map(([lx, ly]) => [f[0] + lx * c - ly * s, f[1] + lx * s + ly * c]);
  ctx.setLineDash([3, 3]); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}

function showLog(time){
  const done = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9));
  let html = "";
  for(let t = 0; t < done; t++) html += `<p><b>Ход ${t + 1}</b></p>` + S.logs[t].map(l => `<p>${esc(l)}</p>`).join("");
  if(!done) html = `<p class="note">Строки журнала появятся в конце хода.</p>`;
  if($("log").dataset.n !== String(done)){ $("log").innerHTML = html; $("log").dataset.n = done; }
}
function showUnits(fr){
  $("units").innerHTML = S.units.map((u, i) => {
    const v = fr[i][3], kind = {infantry:"пехота", pike:"пикинёры", archer:"стрелки", cavalry:"конница"}[u.type] || u.type;
    return `<div class="unit${i === sel ? " sel" : ""}" data-i="${i}"><span class="sw" style="background:${COLORS[i % COLORS.length]}"></span>
      <span>${esc(u.name)}</span><small>${kind}, ${u.men} чел., фронт ${u.front} × ${u.depth} м · норма ${u.norm} м · сейчас ${(v).toFixed(1).replace(".", ",")} м нормы/с${u.note ? " · " + esc(u.note) : ""}</small></div>`;
  }).join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(i){
  S = DATA.scenes[i]; sel = 0; frame = 0; playing = false; $("play").textContent = "▶";
  $("note").textContent = S.note;
  $("slider").max = S.frames.length - 1;
  $("log").dataset.n = "";
  document.querySelectorAll("#tabs button").forEach((b, k) => b.classList.toggle("on", k === i));
  bakeTerrain(); fit(); draw();
}

let last = 0;
function tick(ts){
  if(playing){
    const dt = last ? (ts - last) / 1000 : 0;
    frame = Math.min(S.frames.length - 1, frame + dt * speed / S.dt);
    if(frame >= S.frames.length - 1){ playing = false; $("play").textContent = "▶"; }
    draw();
  }
  last = ts; requestAnimationFrame(tick);
}

if(!DATA){
  document.body.innerHTML = `<p style="padding:24px">Нет данных. Запусти из папки core: <code>dotnet run --project Tests -- polygon</code> и открой core/polygon/polygon.html.</p>`;
} else {
  $("tabs").innerHTML = DATA.scenes.map((s, i) => `<button>${esc(s.name)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b, i) => b.onclick = () => load(i));
  $("made").textContent = "Записано: " + DATA.made;
  $("play").onclick = () => { if(frame >= S.frames.length - 1) frame = 0; playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; };
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
    speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("slider").oninput = e => { frame = +e.target.value; draw(); };
  ["showRoute", "showFlow", "showSlots"].forEach(id => $(id).onchange = draw);
  $("units").onclick = e => { const el = e.target.closest(".unit"); if(el){ sel = +el.dataset.i; draw(); } };
  addEventListener("keydown", e => {
    if(e.code === "Space"){ e.preventDefault(); $("play").click(); }
    if(e.code === "ArrowRight"){ frame = Math.min(S.frames.length - 1, Math.floor(frame) + 1); draw(); }
    if(e.code === "ArrowLeft"){ frame = Math.max(0, Math.ceil(frame) - 1); draw(); }
  });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    view.ox = mx - (mx - view.ox) * k; view.oy = my - (my - view.oy) * k; view.s *= k; draw();
  }, {passive: false});
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(drag){ view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y; draw(); } });
  cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("dblclick", () => { fit(); draw(); });
  addEventListener("resize", () => { fit(); draw(); });
  load(0);
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
