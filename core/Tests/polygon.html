<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон движения</title>
<!-- Шаблон полигона (Г55). Данные подставляет dotnet run --project Tests -- polygon → core/polygon/polygon.html -->
<style>
:root{
  --bg:#f4f1e8; --panel:#fbfaf5; --ink:#24221d; --muted:#6b675c; --line:#d9d3c2; --accent:#8a5a1f; --chip:#ece6d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
body{ display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header{ display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1{ font-size:16px; margin:0 8px 0 0; font-weight:650; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
button{ font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
button.on{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
main{ display:grid; grid-template-columns:1fr 340px; min-height:0; }
#wrap{ position:relative; min-width:0; min-height:0; }
canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
canvas.drag{ cursor:grabbing; }
aside{ border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; }
aside h2{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
.note{ color:var(--muted); margin:0; }
.unit{ display:grid; grid-template-columns:14px 1fr; gap:2px 8px; padding:6px; border-radius:6px; cursor:pointer; }
.unit:hover{ background:var(--chip); }
.unit.sel{ outline:1px solid var(--accent); }
.sw{ width:12px; height:12px; border-radius:3px; margin-top:3px; }
.unit small{ grid-column:2; color:var(--muted); }
label{ display:flex; gap:6px; align-items:center; margin:3px 0; }
.log p{ margin:0 0 4px; font-size:13px; }
.log b{ color:var(--accent); font-weight:600; }
footer{ display:flex; gap:10px; align-items:center; padding:8px 16px; border-top:1px solid var(--line); }
#time{ min-width:120px; font-variant-numeric:tabular-nums; }
#slider{ flex:1; accent-color:var(--accent); }
.hint{ position:absolute; left:10px; bottom:8px; color:var(--muted); font-size:12px; background:var(--panel); padding:2px 6px; border-radius:4px; opacity:.85; }
@media (max-width:760px){
  main{ grid-template-columns:1fr; grid-template-rows:55vh auto; }
  aside{ border-left:none; border-top:1px solid var(--line); }
  footer{ flex-wrap:wrap; }
}
</style>
</head>
<body>
<header>
  <h1>Полигон движения</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div class="hint">колесо — приближение · тянуть — сдвиг · двойной щелчок — вся карта · пробел — пауза</div></div>
  <aside>
    <p class="note" id="note"></p>
    <h2>Отряды</h2><div id="units"></div>
    <h2>Показать</h2>
    <label><input type="checkbox" id="showMen" checked> человечки вблизи (иначе плашки)</label>
    <label><input type="checkbox" id="showRoute" checked> путь и цель</label>
    <label><input type="checkbox" id="showFlow"> карта направлений выбранного отряда</label>
    <label><input type="checkbox" id="showSlots"> места в строю</label>
    <label><input type="checkbox" id="showGrid" checked> тетрадная клетка 10 м</label>
    <label><input type="checkbox" id="greyMen"> серые фигурки (Г7; иначе тело в цвете стороны)</label>
    <h2>Журнал</h2><div class="log" id="log"></div>
    <p class="note" id="made"></p>
  </aside>
</main>
<footer>
  <button id="play">▶</button>
  <button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  <span id="time"></span>
  <input type="range" id="slider" min="0" value="0" step="1">
</footer>
<script src="polygon-men.js"></script>
<script>
const DATA = /*DATA*/null;
// цвет стороны (В4): отряды одной фракции — оттенки её цвета, чтобы свои различались, а стороны читались сразу
const SIDE = {1: ["#b5372b", "#c8662c", "#9b2d52", "#cf8f2e", "#8a2c2a", "#d4573c"], 2: ["#2f63a8", "#2c8b9e", "#5a4aa2", "#4583c8", "#27497f", "#5b7fb6"],
  3: ["#2f7d4a", "#4f9a3a", "#24685e", "#6f9a2e"], 4: ["#c9a227", "#d9c04a", "#a8841c", "#e0b84e"]};
function sideColor(i){
  const f = S.units[i].faction || 1, pal = SIDE[f] || SIDE[1];
  let k = 0;
  for(let j = 0; j < i; j++) if((S.units[j].faction || 1) === f) k++;
  return pal[k % pal.length];
}
const DX = [-1,0,1,-1,1,-1,0,1], DY = [-1,-1,-1,0,0,1,1,1];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, sel = 0, frame = 0, playing = false, speed = 1, view = null;

function decode(str, n){
  const out = new Uint8Array(n); let p = 0;
  if(!str) return out;
  for(const run of str.split(",")){ const [v, c] = run.split(".").map(x => parseInt(x, 36)); out.fill(v, p, p + c); p += c; }
  return out;
}
// ══ Земля и постройки (В1–В3): облик в духе Iron Kings — идеи, рисунок свой (Г10) ══
// Карта рисуется плитками 256 px под ступень приближения (×2) и копится в кэше; пока плитки нет — видна плитка
// ступенью крупнее или общая карта. Плитка — в два прохода. Попиксельно: земля с неровными краями (граница клеток 5 м
// плюс шум), тёмная кромка воды, обочины, светотень холмов и горизонтали. Векторно: тетрадная клетка, трава, рябь,
// тени, мосты, частокол, стены с зубцами, ворота, пролом, камни, кусты, деревья, дома, башни. Сверху — зерно бумаги.
// Свет — справа сверху, тени ложатся влево вниз. Рисунок не трогает правила: клетки те же, что у движка.
const TILE = 256, SHB = 24, SH_X = -0.6, SH_Y = 0.8;
// под постройкой: стена, башня, дом, пролом — поле, ворота — дорога, мост — вода
const UNDER = {0: 1, 9: 7, 12: 1, 13: 2, 14: 1, 15: 1, 18: 1, 20: 1};
// цвет земли и неровность края (0 — край ровно по клеткам)
const GROUND = {1: ["#9ca86c", .28], 2: ["#b9a072", .16], 3: ["#dccb98", .3], 4: ["#eceff2", .3], 5: ["#919f62", .34],
  6: ["#6a7f4c", .3], 7: ["#5b8aa5", .2], 8: ["#88aebd", .14], 10: ["#77885f", .3], 11: ["#9a968b", .3],
  16: ["#587a7b", .06], 17: ["#977d59", .05], 19: ["#b4ad9f", 0]};
const GR = new Float32Array(21), GG = new Float32Array(21), GB = new Float32Array(21), AMP = new Float32Array(21), WETA = new Uint8Array(21);
for(let k = 0; k <= 20; k++){
  const [hex, a] = GROUND[k] || GROUND[1];
  GR[k] = parseInt(hex.slice(1, 3), 16); GG[k] = parseInt(hex.slice(3, 5), 16); GB[k] = parseInt(hex.slice(5, 7), 16);
  AMP[k] = a; WETA[k] = k === 7 || k === 8 || k === 16 ? 1 : 0;
}
// кроны: тень-контур, основной тон, середина, блик
const TREES = [["#2f3d24", "#3e5c34", "#557a3e", "#74984e"], ["#33401f", "#46622f", "#5f7f3a", "#86a052"],
  ["#2c3b2c", "#3a5940", "#4f744c", "#6d9466"], ["#4a4320", "#76702f", "#958c3c", "#b8ac58"]];
const BUSH = ["#36452a", "#5e8040", "#78994e", "#9ab868"];
const ROOFS = ["#ad5a3c", "#c3a468", "#6c7480", "#8c6846"];   // черепица, солома, сланец, дранка
let SHOW_GRID = true, MAP = null, OVER = null, want = [];
const TILES = new Map();

// шум для неровных краёв и пятен: значения в узлах решётки, плавно между ними
function h2(x, y, s){
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vn(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = h2(ix, iy, s), b = h2(ix + 1, iy, s), c = h2(ix, iy + 1, s), d = h2(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// какой вид земли в точке: доля каждого вида среди четырёх ближних клеток плюс шум — край идёт по границе клеток, но живой
let PICK_M = 1;
function pick(a, b, cc, d, w00, w10, w01, w11, wx, wy, fine){
  let best = a, bs = -9, ss = -9;
  for(let q = 0; q < 4; q++){
    const k = q === 0 ? a : q === 1 ? b : q === 2 ? cc : d;
    if((q > 0 && k === a) || (q > 1 && k === b) || (q > 2 && k === cc)) continue;
    let s = (a === k ? w00 : 0) + (b === k ? w10 : 0) + (cc === k ? w01 : 0) + (d === k ? w11 : 0);
    const amp = AMP[k];
    if(amp) s += amp * (1.2 * vn(wx / 5.5 + k * 7.3, wy / 5.5 - k * 3.1, k) + (fine ? 0.8 * vn(wx / 1.9 + k * 5.1, wy / 1.9, k + 40) : 0.4) - 1);
    if(s > bs){ ss = bs; bs = s; best = k; } else if(s > ss) ss = s;
  }
  PICK_M = bs - ss;
  return best;
}
function classAt(wx, wy){
  const {gt, cols, rows, c} = MAP, fx = wx / c - 0.5, fy = wy / c - 0.5, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
  const x0 = Math.max(0, Math.min(cols - 1, ix)), x1 = Math.max(0, Math.min(cols - 1, ix + 1));
  const y0 = Math.max(0, Math.min(rows - 1, iy)), y1 = Math.max(0, Math.min(rows - 1, iy + 1));
  const a = gt[y0 * cols + x0], b = gt[y0 * cols + x1], cc = gt[y1 * cols + x0], d = gt[y1 * cols + x1];
  if(a === b && a === cc && a === d) return a;
  return pick(a, b, cc, d, (1 - tx) * (1 - ty), tx * (1 - ty), (1 - tx) * ty, tx * ty, wx, wy, true);
}

// Подготовка сцены: виды земли, сглаженная высота, укрепления линиями, башни и дома кусками
function prepMap(){
  const cols = S.cols, rows = S.rows, n = cols * rows, c = S.w / cols;
  const t = decode(S.t, n), z = decode(S.z, n), gt = new Uint8Array(n), zb = new Float32Array(n);
  for(let i = 0; i < n; i++){ const k = t[i]; gt[i] = UNDER[k] ?? (GROUND[k] ? k : 1); }
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){   // высота для светотени — сглаженная 3 × 3
    let s = 0, m = 0;
    for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
      const xx = x + dx, yy = y + dy;
      if(xx >= 0 && yy >= 0 && xx < cols && yy < rows){ s += z[yy * cols + xx]; m++; }
    }
    zb[y * cols + x] = s / m;
  }
  const at = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows ? 0 : t[y * cols + x];
  // материал укрепления: 1 — камень, 2 — частокол, 3 — окоп; ворота и башни — как их соседи
  const mat = new Uint8Array(n);
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const i = y * cols + x, k = t[i];
    if(k === 12) mat[i] = 1; else if(k === 15) mat[i] = 2; else if(k === 17) mat[i] = 3;
    else if(k === 13 || k === 14){
      let s = 0, p = 0;
      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++){ const q = at(x + dx, y + dy); if(q === 12) s++; else if(q === 15) p++; }
      mat[i] = p > s ? 2 : 1;
    }
  }
  const matAt = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows ? 0 : mat[y * cols + x];
  // середины клеток укреплений, дважды сглаженные по соседям: лесенка из клеток становится плавной линией
  let px = new Float32Array(n), py = new Float32Array(n);
  for(let i = 0; i < n; i++){ px[i] = (i % cols + 0.5) * c; py[i] = (Math.floor(i / cols) + 0.5) * c; }
  for(let it = 0; it < 2; it++){
    const nx = px.slice(), ny = py.slice();
    for(let i = 0; i < n; i++){
      const m = mat[i]; if(!m) continue;
      const x = i % cols, y = (i - x) / cols;
      let sx = 2 * px[i], sy = 2 * py[i], w = 2;
      for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
        if((dx || dy) && matAt(x + dx, y + dy) === m){ const j = (y + dy) * cols + x + dx; sx += px[j]; sy += py[j]; w++; }
      }
      nx[i] = sx / w; ny[i] = sy / w;
    }
    px = nx; py = ny;
  }
  // связи: вправо, вниз и по диагонали (диагональ — только если угол не закрыт клеткой того же укрепления)
  const lines = {1: new Path2D(), 2: new Path2D(), 3: new Path2D()}, deg = new Uint8Array(n);
  for(let i = 0; i < n; i++){
    const m = mat[i]; if(!m) continue;
    const x = i % cols, y = (i - x) / cols;
    for(const [dx, dy] of [[1, 0], [0, 1], [1, 1], [-1, 1]]){
      if(matAt(x + dx, y + dy) !== m) continue;
      if(dx && dy && (matAt(x + dx, y) === m || matAt(x, y + dy) === m)) continue;
      const j = (y + dy) * cols + x + dx;
      lines[m].moveTo(px[i], py[i]); lines[m].lineTo(px[j], py[j]); deg[i]++; deg[j]++;
    }
  }
  for(let i = 0; i < n; i++) if(mat[i] && !deg[i]){ lines[mat[i]].moveTo(px[i], py[i]); lines[mat[i]].lineTo(px[i] + 0.01, py[i]); }
  const gates = [], rubble = [];
  for(let i = 0; i < n; i++){
    const x = i % cols, y = (i - x) / cols;
    if(t[i] === 13) gates.push({x: px[i], y: py[i], horiz: matAt(x - 1, y) === mat[i] || matAt(x + 1, y) === mat[i], m: mat[i]});
    if(t[i] === 20) rubble.push({x: (x + 0.5) * c, y: (y + 0.5) * c, i});
  }
  // связные куски одного вида: башни (по 8 соседям), дома и мосты (по 4)
  const comps = (kind, diag) => {
    const seen = new Uint8Array(n), out = [];
    for(let s = 0; s < n; s++){
      if(t[s] !== kind || seen[s]) continue;
      const cells = [], st = [s]; seen[s] = 1;
      while(st.length){
        const i = st.pop(), x = i % cols, y = (i - x) / cols; cells.push([x, y]);
        for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
          if(!(dx || dy) || (!diag && dx && dy) || at(x + dx, y + dy) !== kind) continue;
          const j = (y + dy) * cols + x + dx;
          if(!seen[j]){ seen[j] = 1; st.push(j); }
        }
      }
      const xs = cells.map(q => q[0]), ys = cells.map(q => q[1]);
      out.push({cells, i: s, x0: Math.min(...xs) * c, y0: Math.min(...ys) * c, x1: (Math.max(...xs) + 1) * c, y1: (Math.max(...ys) + 1) * c});
    }
    return out;
  };
  // башня — круг с площадь обычной башни карты; слипшиеся башни (кусок вдвое больше обычного) делятся по скоплениям клеток
  const tc = comps(14, true), sizes = tc.map(q => q.cells.length).sort((a, b) => a - b), usual = sizes[sizes.length >> 1] || 1;
  const towers = tc.flatMap(q => {
    const P = q.cells.map(([x, y]) => [(x + 0.5) * c, (y + 0.5) * c]), k = Math.max(1, Math.round(P.length / usual));
    let C = [P[0]];
    while(C.length < k){   // центры — самые далёкие клетки, потом несколько шагов к серединам скоплений
      let best = P[0], bd = -1;
      for(const p of P){ const d = Math.min(...C.map(q2 => Math.hypot(p[0] - q2[0], p[1] - q2[1]))); if(d > bd){ bd = d; best = p; } }
      C.push(best);
    }
    for(let it = 0; it < 6; it++){
      const acc = C.map(() => [0, 0, 0]);
      for(const p of P){ let j = 0; C.forEach((q2, jj) => { if(Math.hypot(p[0] - q2[0], p[1] - q2[1]) < Math.hypot(p[0] - C[j][0], p[1] - C[j][1])) j = jj; }); acc[j][0] += p[0]; acc[j][1] += p[1]; acc[j][2]++; }
      C = acc.map((a, j) => a[2] ? [a[0] / a[2], a[1] / a[2]] : C[j]);
    }
    const r = Math.sqrt(P.length / k) * c * 0.52 + 0.3;
    return C.map(([x, y], j) => ({...q, i: q.i + j, m: mat[q.i], r, x, y}));
  });
  // дом — прямоугольник; неровный кусок режется на прямоугольники: от верхней левой клетки вправо, потом вниз полными рядами
  const houses = comps(18, false).flatMap(q => {
    const left = new Set(q.cells.map(([x, y]) => y * cols + x)), out = [];
    while(left.size){
      const s = Math.min(...left), x0 = s % cols, y0 = (s - x0) / cols;
      let x1 = x0; while(left.has(y0 * cols + x1 + 1)) x1++;
      let y1 = y0;
      while(true){ let ok = true; for(let x = x0; x <= x1; x++) if(!left.has((y1 + 1) * cols + x)){ ok = false; break; } if(!ok) break; y1++; }
      for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++) left.delete(y * cols + x);
      out.push({x0: x0 * c, y0: y0 * c, x1: (x1 + 1) * c, y1: (y1 + 1) * c, i: s, n: (x1 - x0 + 1) * (y1 - y0 + 1)});
    }
    return out;
  });
  // мост — один настил вдоль главной оси его клеток (лесенка клеток по диагонали становится ровным мостом)
  const bridges = comps(9, false).map(q => {
    const P = q.cells.map(([x, y]) => [(x + 0.5) * c, (y + 0.5) * c]), n1 = P.length;
    const mx = P.reduce((s, p) => s + p[0], 0) / n1, my = P.reduce((s, p) => s + p[1], 0) / n1;
    let sxx = 0, syy = 0, sxy = 0;
    for(const [x, y] of P){ sxx += (x - mx) ** 2; syy += (y - my) ** 2; sxy += (x - mx) * (y - my); }
    let a = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    if(n1 === 1){   // одна клетка — поперёк воды
      const [x, y] = q.cells[0];
      a = WETA[UNDER[at(x - 1, y)] ?? at(x - 1, y)] && WETA[UNDER[at(x + 1, y)] ?? at(x + 1, y)] ? Math.PI / 2 : 0;
    }
    const ux = Math.cos(a), uy = Math.sin(a), along = P.map(([x, y]) => (x - mx) * ux + (y - my) * uy), across = P.map(([x, y]) => -(x - mx) * uy + (y - my) * ux);
    const t0 = Math.min(...along), t1 = Math.max(...along), s0 = Math.min(...across), s1 = Math.max(...across);
    return {...q, cx: mx + ux * (t0 + t1) / 2 - uy * (s0 + s1) / 2, cy: my + uy * (t0 + t1) / 2 + ux * (s0 + s1) / 2, a,
      len: t1 - t0 + c, w: Math.max(4, s1 - s0 + c * 0.6)};

// грань крыши светлее, если смотрит к солнцу (вправо вверх)

// вальмовая крыша: конёк вдоль длинной стороны, четыре ската в два тона, ряды черепицы
function roof(g, x0, y0, x1, y1, base, L, o, tent){
  const w = x1 - x0, h = y1 - y0, wide = w >= h, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const hl = tent ? 0 : Math.abs(w - h) / 2;
  const ra = wide ? [cx - hl, cy] : [cx, cy - hl], rb = wide ? [cx + hl, cy] : [cx, cy + hl];
  const F = [
    [[[x0, y0], [x1, y0], rb, ra], 0, -1],
    [[[x1, y0], [x1, y1], rb], 1, 0],
    [[[x1, y1], [x0, y1], ra, rb], 0, 1],
    [[[x0, y1], [x0, y0], ra], -1, 0],
  ];

  if(!wide){ F[0][0] = [[x0, y0], [x1, y0], ra]; F[1][0] = [[x1, y0], [x1, y1], rb, ra]; F[2][0] = [[x1, y1], [x0, y1], rb]; F[3][0] = [[x0, y1], [x0, y0], ra, rb]; }

    g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath();

}
// башня: каменное кольцо с зубцами и конус крыши из восьми граней; у острога — деревянная вышка

    const a = r * 0.8;

  g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fillStyle = "#c6bfae"; g.fill();

    const a0 = k * Math.PI / 4, a1 = a0 + Math.PI / 4, am = (a0 + a1) / 2;
    g.beginPath(); g.moveTo(x, y); g.arc(x, y, rr, a0, a1); g.closePath();

// Общая карта мельче — подложка, пока плиток нужной ступени нет
function makeOverview(){
  const Lo = Math.pow(2, Math.floor(Math.log2(1024 / Math.max(S.w, S.h)))), span = TILE / Lo;
  const c = document.createElement("canvas"); c.width = Math.ceil(S.w * Lo); c.height = Math.ceil(S.h * Lo);
  const g = c.getContext("2d");
  for(let ty = 0; ty * span < S.h; ty++) for(let tx = 0; tx * span < S.w; tx++){
    const tile = makeTile(Lo, tx, ty); g.drawImage(tile, tx * TILE, ty * TILE); TILES.set(`${Lo}|${tx}|${ty}`, tile);
  }
  OVER = {c, L: Lo};
}
const levelFor = () => Math.pow(2, Math.max(-3, Math.min(6, Math.ceil(Math.log2(view.s * (window.devicePixelRatio || 1)) - 0.2))));
function drawGround(r){
  const dpr = window.devicePixelRatio || 1, mx = X(0), my = Y(0), mw = S.w * view.s, mh = S.h * view.s;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 3; ctx.fillStyle = "#9ca86c"; ctx.fillRect(mx, my, mw, mh); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(OVER.c, mx, my, OVER.c.width / OVER.L * view.s, OVER.c.height / OVER.L * view.s);
  const L = levelFor();
  want = [];
  if(L > OVER.L){
    const span = TILE / L, snap = v => Math.round(v * dpr) / dpr;
    const vx0 = Math.max(0, -view.ox / view.s), vy0 = Math.max(0, -view.oy / view.s);
    const vx1 = Math.min(S.w, (r.width - view.ox) / view.s), vy1 = Math.min(S.h, (r.height - view.oy) / view.s);
    const ccx = (vx0 + vx1) / 2, ccy = (vy0 + vy1) / 2;
    for(let ty = Math.floor(vy0 / span); ty * span < vy1; ty++) for(let tx = Math.floor(vx0 / span); tx * span < vx1; tx++){
      const key = `${L}|${tx}|${ty}`, tile = TILES.get(key);
      const ax = snap(X(tx * span)), bx = snap(X((tx + 1) * span)), ay = snap(Y(ty * span)), by = snap(Y((ty + 1) * span));
      if(tile){ TILES.delete(key); TILES.set(key, tile); ctx.drawImage(tile, ax, ay, bx - ax, by - ay); continue; }
      want.push([Math.hypot((tx + 0.5) * span - ccx, (ty + 0.5) * span - ccy), L, tx, ty]);
      const up = TILES.get(`${L / 2}|${tx >> 1}|${ty >> 1}`);   // пока нет — четверть плитки ступенью крупнее
      if(up) ctx.drawImage(up, (tx & 1) * TILE / 2, (ty & 1) * TILE / 2, TILE / 2, TILE / 2, ax, ay, bx - ax, by - ay);

}
// дорисовать недостающие плитки — понемногу за кадр, от середины экрана
function growTiles(){
  const t0 = performance.now();
  while(want.length && performance.now() - t0 < 14){
    const [, L, tx, ty] = want.shift(), key = `${L}|${tx}|${ty}`;
    if(!TILES.has(key)) TILES.set(key, makeTile(L, tx, ty));
  }
  if(TILES.size > 240){ for(const key of TILES.keys()){ if(TILES.size <= 200) break; if(!key.startsWith(OVER.L + "|")) TILES.delete(key); } }
}
// виньетка: края поля темнее
function drawVignette(r){

  const vg = ctx.createRadialGradient(cx, cy, R * 0.42, cx, cy, R * 1.05);

function fit(){
  const r = cv.getBoundingClientRect(), pad = 16;
  const s = Math.min((r.width - 2 * pad) / S.w, (r.height - 2 * pad) / S.h);
  view = {s, ox: (r.width - S.w * s) / 2, oy: (r.height - S.h * s) / 2};

const X = x => view.ox + x * view.s, Y = y => view.oy + y * view.s;

function lerpFrame(f){
  const i = Math.floor(f), a = S.frames[i], b = S.frames[Math.min(i + 1, S.frames.length - 1)], k = f - i;
  return a.map((ua, u) => ua.map((v, j) => {
    const bj = b[u][j];
    if(bj == null || v == null) return v;   // тело выбыло (null) или ещё не было; тела — по постоянному номеру
    if(j === 2){ let d = ((bj - v + 540) % 360) - 180; return v + d * k; }
    return v + (bj - v) * k;
  }));
}

function draw(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)){ cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  drawGround(r);
  const fr = lerpFrame(frame);

  if($("showFlow").checked) drawFlow(S.units[sel]);
  drawDead();   // павшие и кровь (Г67)
  // бой (БД1): павшие фигурки — серые крестики там, где упали (если поимённых павших нет)
  if(S.fallen && !S.dead) S.fallen.forEach(list => {
    ctx.strokeStyle = "rgba(60,50,40,.55)"; ctx.lineWidth = 1;
    list.forEach(([x, y, fi]) => {
      if(fi > frame) return;
      const px = X(x), py = Y(y), s = Math.max(1.5, 1.2 * view.s);
      ctx.beginPath(); ctx.moveTo(px - s, py - s); ctx.lineTo(px + s, py + s); ctx.moveTo(px + s, py - s); ctx.lineTo(px - s, py + s); ctx.stroke();
    });

  const hf = S.heads ? S.heads[Math.min(S.heads.length - 1, Math.round(frame))] : null;
  if(hf) for(const [ui, k, a] of hf) HD.set(ui * 100000 + k, a * Math.PI / 180);

    const col = u.col;

      ctx.beginPath(); ctx.moveTo(X(tx), Y(ty)); ctx.lineTo(X(tx + Math.sin(a) * 25), Y(ty - Math.cos(a) * 25)); ctx.stroke();

      u.figs.forEach((fig, k) => {
        const fx = f[4 + 2 * k], fy = f[5 + 2 * k];
        if(fx == null) return;
        const pad = (Math.max(fig[0], fig[1]) / 2 + 5) * view.s, sx = X(fx), sy = Y(fy);   // за краем экрана не рисуем

    } else {

      u.figs.forEach(([w, d], k) => {

        ctx.save(); ctx.translate(x, y); ctx.rotate(figHead(i, k) ?? HD.get(i * 100000 + k) ?? h);   // курс фигурки — куда идёт (В10)

    if($("showMen").checked && view.s >= 1.5) drawBanner(f, h, u.depth, col);   // поверх линии курса
    // карта всегда «бумажная» — подпись тёмная со светлой обводкой в любой теме

  $("slider").value = Math.round(frame);

}

function drawFlow(u){
  if(!u || !u.flow) return;
  const cw = S.w / S.cols, ch = S.h / S.rows, step = Math.max(1, Math.round(16 / (cw * view.s)));
  ctx.strokeStyle = "rgba(30,30,30,.45)"; ctx.lineWidth = 1;
  for(let y = Math.floor(step / 2); y < S.rows; y += step) for(let x = Math.floor(step / 2); x < S.cols; x += step){
    const c = u.flow[y * S.cols + x];
    if(c === "." || c === "T") continue;
    const k = c.charCodeAt(0) - 48, dx = DX[k], dy = DY[k], l = Math.hypot(dx * cw, dy * ch);
    const cx = X((x + 0.5) * cw), cy = Y((y + 0.5) * ch), L = Math.min(7, step * cw * view.s * 0.4), ux = dx * cw / l, uy = dy * ch / l;
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
    ctx.lineTo(cx + ux * L - (ux * 3 - uy * 2.5), cy + uy * L - (uy * 3 + ux * 2.5));
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - (ux * 3 + uy * 2.5), cy + uy * L - (uy * 3 - ux * 2.5));
    ctx.stroke();
  }
}

// места в строю: по раскладке фигурок вокруг центра (сетка, как Formation.Layout) — пунктирный контур строя
function drawSlots(u, f, col){
  const h = f[2] * Math.PI / 180, c = Math.cos(h), s = Math.sin(h), fw = u.front / 2, dd = u.depth / 2;
  const pts = [[-fw, -dd], [fw, -dd], [fw, dd], [-fw, dd]].map(([lx, ly]) => [f[0] + lx * c - ly * s, f[1] + lx * s + ly * c]);
  ctx.setLineDash([3, 3]); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}

function showLog(time){
  const done = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9));
  let html = "";
  for(let t = 0; t < done; t++) html += `<p><b>Ход ${t + 1}</b></p>` + S.logs[t].map(l => `<p>${esc(l)}</p>`).join("");
  if(!done) html = `<p class="note">Строки журнала появятся в конце хода.</p>`;
  if($("log").dataset.n !== String(done)){ $("log").innerHTML = html; $("log").dataset.n = done; }
}
function showUnits(fr){
  $("units").innerHTML = S.units.map((u, i) => {
    const v = fr[i][3], kind = {infantry:"пехота", pike:"пикинёры", archer:"стрелки", cavalry:"конница"}[u.type] || u.type;
    const now = S.soldiers ? S.soldiers[Math.min(S.soldiers.length - 1, Math.round(frame))][i] : null;
    return `<div class="unit${i === sel ? " sel" : ""}" data-i="${i}"><span class="sw" style="background:${u.col}"></span>
      <span>${esc(u.name)}</span><small>${kind}, ${now !== null ? `в строю ${now} из ${u.men}` : `${u.men} чел.`}, фронт ${u.front} × ${u.depth} м · норма ${u.norm} м · сейчас ${(v).toFixed(1).replace(".", ",")} м нормы/с${u.note ? " · " + esc(u.note) : ""}</small></div>`;
  }).join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(i){
  S = DATA.scenes[i]; sel = 0; frame = 0; playing = false; $("play").textContent = "▶";
  $("note").textContent = S.note;
  $("slider").max = S.frames.length - 1;
  $("log").dataset.n = "";
  document.querySelectorAll("#tabs button").forEach((b, k) => b.classList.toggle("on", k === i));
  S.units.forEach((u, k) => u.col = sideColor(k));
  prepMap(); TILES.clear(); want = []; makeOverview(); fit(); draw();
}

let last = 0;
function tick(ts){
  const grow = want.length > 0;
  if(grow) growTiles();   // плитки земли дорисовываются понемногу, пока картинка не станет чёткой
  if(playing){
    const dt = last ? (ts - last) / 1000 : 0;
    frame = Math.min(S.frames.length - 1, frame + dt * speed / S.dt);
    if(frame >= S.frames.length - 1){ playing = false; $("play").textContent = "▶"; }
  }
  if(playing || grow) draw();
  last = ts; requestAnimationFrame(tick);
}

if(!DATA){
  document.body.innerHTML = `<p style="padding:24px">Нет данных. Запусти из папки core: <code>dotnet run --project Tests -- polygon</code> и открой core/polygon/polygon.html.</p>`;
} else {
  $("tabs").innerHTML = DATA.scenes.map((s, i) => `<button>${esc(s.name)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b, i) => b.onclick = () => load(i));
  $("made").textContent = "Записано: " + DATA.made;
  $("play").onclick = () => { if(frame >= S.frames.length - 1) frame = 0; playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; };
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
    speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("slider").oninput = e => { frame = +e.target.value; draw(); };
  ["showMen", "showRoute", "showFlow", "showSlots"].forEach(id => $(id).onchange = draw);
  $("showGrid").onchange = e => { SHOW_GRID = e.target.checked; TILES.clear(); want = []; makeOverview(); draw(); };
  $("greyMen").onchange = e => { GREY = e.target.checked; SPR.clear(); draw(); };
  $("units").onclick = e => { const el = e.target.closest(".unit"); if(el){ sel = +el.dataset.i; draw(); } };
  addEventListener("keydown", e => {
    if(e.code === "Space"){ e.preventDefault(); $("play").click(); }
    if(e.code === "ArrowRight"){ frame = Math.min(S.frames.length - 1, Math.floor(frame) + 1); draw(); }
    if(e.code === "ArrowLeft"){ frame = Math.max(0, Math.ceil(frame) - 1); draw(); }
  });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    view.ox = mx - (mx - view.ox) * k; view.oy = my - (my - view.oy) * k; view.s *= k; draw();
  }, {passive: false});
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(drag){ view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y; draw(); } });
  cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("dblclick", () => { fit(); draw(); });
  addEventListener("resize", () => { fit(); draw(); });
  load(0);
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
