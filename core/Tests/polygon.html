<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон движения</title>
<!-- Шаблон полигона (Г55). Данные подставляет dotnet run --project Tests -- polygon → core/polygon/polygon.html -->
<style>
:root{
  --bg:#f4f1e8; --panel:#fbfaf5; --ink:#24221d; --muted:#6b675c; --line:#d9d3c2; --accent:#8a5a1f; --chip:#ece6d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
body{ display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header{ display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1{ font-size:16px; margin:0 8px 0 0; font-weight:650; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
button{ font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
button.on{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
main{ display:grid; grid-template-columns:1fr 340px; min-height:0; }
#wrap{ position:relative; min-width:0; min-height:0; }
canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
canvas.drag{ cursor:grabbing; }
aside{ border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; }
aside h2{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
.note{ color:var(--muted); margin:0; }
.unit{ display:grid; grid-template-columns:14px 1fr; gap:2px 8px; padding:6px; border-radius:6px; cursor:pointer; }
.unit:hover{ background:var(--chip); }
.unit.sel{ outline:1px solid var(--accent); }
.sw{ width:12px; height:12px; border-radius:3px; margin-top:3px; }
.unit small{ grid-column:2; color:var(--muted); }
label{ display:flex; gap:6px; align-items:center; margin:3px 0; }
.log p{ margin:0 0 4px; font-size:13px; }
.log b{ color:var(--accent); font-weight:600; }
footer{ display:flex; gap:10px; align-items:center; padding:8px 16px; border-top:1px solid var(--line); }
#time{ min-width:120px; font-variant-numeric:tabular-nums; }
#slider{ flex:1; accent-color:var(--accent); }
.hint{ position:absolute; left:10px; bottom:8px; color:var(--muted); font-size:12px; background:var(--panel); padding:2px 6px; border-radius:4px; opacity:.85; }
@media (max-width:760px){
  main{ grid-template-columns:1fr; grid-template-rows:55vh auto; }
  aside{ border-left:none; border-top:1px solid var(--line); }
  footer{ flex-wrap:wrap; }
}
</style>
</head>
<body>
<header>
  <h1>Полигон движения</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div class="hint">колесо — приближение · тянуть — сдвиг · двойной щелчок — вся карта · пробел — пауза</div></div>
  <aside>
    <p class="note" id="note"></p>
    <h2>Отряды</h2><div id="units"></div>
    <h2>Показать</h2>
    <label><input type="checkbox" id="showMen" checked> человечки вблизи (иначе плашки)</label>
    <label><input type="checkbox" id="showRoute" checked> путь и цель</label>
    <label><input type="checkbox" id="showFlow"> карта направлений выбранного отряда</label>
    <label><input type="checkbox" id="showSlots"> места в строю</label>
    <h2>Журнал</h2><div class="log" id="log"></div>
    <p class="note" id="made"></p>
  </aside>
</main>
<footer>
  <button id="play">▶</button>
  <button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  <span id="time"></span>
  <input type="range" id="slider" min="0" value="0" step="1">
</footer>
<script>
const DATA = /*DATA*/null;
const COLORS = ["#c0392b", "#2c6fbb", "#2e8b57", "#b8860b", "#7d3c98", "#d35400"];
// местность: коды как в Terrain.cs
const TERRAIN = {0:"#e9e4d4",1:"#e9e4d4",2:"#cdb68a",3:"#e8d49a",4:"#f4f6f8",5:"#b9c79a",6:"#7f9d6a",7:"#7fa6c9",8:"#a9c4dc",9:"#a0896a",
  10:"#8fa58c",11:"#9a958c",12:"#6d665e",13:"#8b6d4a",14:"#5c554e",15:"#8b6d4a",16:"#6f8fa8",17:"#a08f6e",18:"#7c6f63",19:"#c9c2b2",20:"#b0a48f"};
const DX = [-1,0,1,-1,1,-1,0,1], DY = [-1,-1,-1,0,0,1,1,1];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, sel = 0, frame = 0, playing = false, speed = 1, view = null, terrainImg = null;

function decode(str, n){
  const out = new Uint8Array(n); let p = 0;
  if(!str) return out;
  for(const run of str.split(",")){ const [v, c] = run.split(".").map(x => parseInt(x, 36)); out.fill(v, p, p + c); p += c; }
  return out;
}
function bakeTerrain(){
  const k = 4, c = document.createElement("canvas"); c.width = S.cols * k; c.height = S.rows * k;
  const g = c.getContext("2d"), t = decode(S.t, S.cols * S.rows), z = decode(S.z, S.cols * S.rows);
  for(let y = 0; y < S.rows; y++) for(let x = 0; x < S.cols; x++){
    const i = y * S.cols + x;
    g.fillStyle = TERRAIN[t[i]] || "#e9e4d4"; g.fillRect(x * k, y * k, k, k);
    if(z[i]){ g.fillStyle = `rgba(120,80,30,${0.07 * z[i]})`; g.fillRect(x * k, y * k, k, k); }
  }
  // горизонтали: граница уровней высоты
  g.fillStyle = "rgba(90,60,25,.55)";
  for(let y = 0; y < S.rows; y++) for(let x = 0; x < S.cols; x++){
    const i = y * S.cols + x;
    if(x + 1 < S.cols && z[i] !== z[i + 1]) g.fillRect((x + 1) * k - 0.5, y * k, 1, k);
    if(y + 1 < S.rows && z[i] !== z[i + S.cols]) g.fillRect(x * k, (y + 1) * k - 0.5, k, 1);
  }
  terrainImg = c;
}

function fit(){
  const r = cv.getBoundingClientRect(), pad = 16;
  const s = Math.min((r.width - 2 * pad) / S.w, (r.height - 2 * pad) / S.h);
  view = {s, ox: (r.width - S.w * s) / 2, oy: (r.height - S.h * s) / 2};
}
const X = x => view.ox + x * view.s, Y = y => view.oy + y * view.s;

function lerpFrame(f){
  const i = Math.floor(f), a = S.frames[i], b = S.frames[Math.min(i + 1, S.frames.length - 1)], k = f - i;
  return a.map((ua, u) => ua.map((v, j) => {
    const bj = b[u][j];
    if(bj === undefined) return v;   // бой: фигурка упала между кадрами
    if(j === 2){ let d = ((bj - v + 540) % 360) - 180; return v + d * k; }
    return v + (bj - v) * k;
  }));
}

function draw(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)){ cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(terrainImg, X(0), Y(0), S.w * view.s, S.h * view.s);
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.strokeRect(X(0), Y(0), S.w * view.s, S.h * view.s);
  const fr = lerpFrame(frame);

  if($("showFlow").checked) drawFlow(S.units[sel]);
  drawDead();   // павшие и кровь (Г67)
  // бой (БД1): павшие фигурки — серые крестики там, где упали (если поимённых павших нет)
  if(S.fallen && !S.dead) S.fallen.forEach(list => {
    ctx.strokeStyle = "rgba(60,50,40,.55)"; ctx.lineWidth = 1;
    list.forEach(([x, y, fi]) => {
      if(fi > frame) return;
      const px = X(x), py = Y(y), s = Math.max(1.5, 1.2 * view.s);
      ctx.beginPath(); ctx.moveTo(px - s, py - s); ctx.lineTo(px + s, py + s); ctx.moveTo(px + s, py - s); ctx.lineTo(px - s, py + s); ctx.stroke();
    });
  });
  S.units.forEach((u, i) => {
    const col = COLORS[i % COLORS.length];
    if($("showRoute").checked && u.route){
      ctx.setLineDash([6, 5]); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
      u.route.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke(); ctx.setLineDash([]);
      const [tx, ty, tf] = u.order, a = tf * Math.PI / 180;
      ctx.beginPath(); ctx.arc(X(tx), Y(ty), 4, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(tx), Y(ty)); ctx.lineTo(X(tx + Math.sin(a) * 25), Y(ty - Math.cos(a) * 25)); ctx.stroke();
    }
    const f = fr[i], h = f[2] * Math.PI / 180;
    if($("showSlots").checked) drawSlots(u, f, col);
    if($("showMen").checked && view.s >= MEN_FROM){
      // вблизи — человечки (Г32); идущий отряд шагает
      const moving = f[3] > 0.02, t = frame * S.dt;
      u.figs.forEach((fig, k) => { if(f[4 + 2 * k] !== undefined) drawMen(u, fig, f[4 + 2 * k], f[5 + 2 * k], h, col, moving, t, k); });
    } else {
      // издали — плашка: фигурка одним прямоугольником
      ctx.fillStyle = col; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 0.6;
      u.figs.forEach(([w, d], k) => {
        if(f[4 + 2 * k] === undefined) return;   // бой: фигурок стало меньше (Г30)
        const x = X(f[4 + 2 * k]), y = Y(f[5 + 2 * k]);
        ctx.save(); ctx.translate(x, y); ctx.rotate(h);
        const W = Math.max(1.2, w * view.s), D = Math.max(1, d * view.s);
        ctx.fillRect(-W / 2, -D / 2, W, D); if(view.s > 2) ctx.strokeRect(-W / 2, -D / 2, W, D);
        ctx.restore();
      });
    }
    // центр строя и курс
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(X(f[0]), Y(f[1])); ctx.lineTo(X(f[0] + Math.sin(h) * (u.depth / 2 + 14)), Y(f[1] - Math.cos(h) * (u.depth / 2 + 14))); ctx.stroke();
    if($("showMen").checked && view.s >= 1.5) drawBanner(f, h, u.depth, col);   // поверх линии курса
    // карта всегда «бумажная» — подпись тёмная со светлой обводкой в любой теме
    const lx = X(f[0]) + 8, ly = Y(f[1]) + u.depth / 2 * view.s + 16;
    ctx.font = "600 12px system-ui"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,253,245,.9)"; ctx.lineWidth = 3; ctx.strokeText(u.name, lx, ly);
    ctx.fillStyle = "#1d1b16"; ctx.fillText(u.name, lx, ly);
  });
  const time = frame * S.dt, turn = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9) + 1), tin = time - (turn - 1) * S.turnSec;
  $("time").textContent = `ход ${turn} · ${tin.toFixed(1).replace(".", ",")} с`;
  $("slider").value = Math.round(frame);
  showLog(time);
  showUnits(fr);
}

// ── Человечки (Г32): фигурка 5 × 2 — десять бойцов, вид сверху. Рисунки свои (Г10) ──
// Боец рисуется в метрах, вперёд — вверх (−y). Каждый вид бойца один раз рисуется в маленький холст
// (спрайт) под текущее приближение, дальше фигурка только расставляет копии — так тысячи бойцов
// не тормозят. Разброс в осанке и место в строю «гуляют» по зерну бойца — строй выглядит живым.
const MEN_FROM = 3;   // px на метр: ближе — человечки, дальше — плашки
const INK = "#2b2621", CLOTH = ["#cfcbc2", "#c5c1b7", "#d8d4cb"], STEEL = "#a4a8ab", SHINE = "#e2e4e5", WOOD = "#7a5a36";
const HAIR = ["#6b4a2f", "#8a6a45", "#4b3a2a"], HORSE = ["#7a5233", "#4a3426", "#8b5a2b", "#9a9590", "#2f2b28", "#b08a5a"];
const LOOK_BY_TPL = {militia: "militia", infantry: "spear", guard: "sword", foot_knights: "sword", pikemen: "pike",
  militia_archers: "bow", archers: "bow", crossbowmen: "crossbow", knights: "lance", elite_cavalry: "barded"};
const LOOK_BY_TYPE = {infantry: "spear", pike: "pike", archer: "bow", cavalry: "lance"};
const lookOf = u => LOOK_BY_TPL[u.tpl] || LOOK_BY_TYPE[u.type] || "spear";
// рамка рисунка каждой позы, м: [x0, y0, x1, y1]
const BOX = {militia: [-.4, -1.5, .4, .4], militiaUp: [-.4, -.45, .4, .4], spear: [-.4, -1.5, .4, .4], spearUp: [-.4, -.45, .4, .4],
  sword: [-.4, -.9, .4, .4], bow: [-.4, -.65, .4, .4], crossbow: [-.4, -.75, .4, .4],
  pikeDown: [-.4, -4.45, .4, .8], pikeDown2: [-.45, -4.45, .4, .8], pikeUp: [-.4, -.5, .4, .4],
  lance: [-.45, -2.85, .45, 1.4], barded: [-.45, -2.85, .45, 1.4]};
// поза бойца по шеренге: пики опущены в первых четырёх, копья — в первых двух
function poseOf(look, rank){
  if(look === "pike") return rank >= 4 ? "pikeUp" : rank % 2 ? "pikeDown2" : "pikeDown";
  if(look === "spear" || look === "militia") return rank >= 2 ? look + "Up" : look;
  return look;
}
function hash(a, b){ let x = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); x ^= x >>> 15; x = Math.imul(x, 0x2c1b3c6d); x ^= x >>> 12; return (x >>> 0) / 4294967296; }

function ell(g, x, y, rx, ry, fill, rot = 0, stroke = true){
  g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
  if(fill){ g.fillStyle = fill; g.fill(); }
  if(stroke){ g.strokeStyle = INK; g.lineWidth = 0.04; g.stroke(); }
}
function stick(g, x0, y0, x1, y1, width, color){
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.strokeStyle = INK; g.lineWidth = width + 0.04; g.stroke();
  g.strokeStyle = color; g.lineWidth = width; g.stroke();
}
function tip(g, x, y, len){ g.beginPath(); g.moveTo(x - 0.045, y); g.lineTo(x, y - len); g.lineTo(x + 0.045, y); g.closePath(); g.fillStyle = SHINE; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.025; g.stroke(); }
function helmet(g, v){ ell(g, 0, 0, 0.12, 0.12, STEEL); ell(g, -0.035, -0.035, 0.04, 0.04, SHINE, 0, false); }
// одежда серая с оттенком цвета отряда — издали отряд узнаётся по цвету, вблизи фигурки всё равно «серые» (Г7)
let TINT = null;
function mix(a, b, k){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
function shoulders(g, fill){ ell(g, 0, 0.02, 0.27, 0.14, TINT ? mix(fill, TINT, 0.3) : fill); }

const PAINT = {
  militia(g, col, v){ militiaman(g, col, v, true); },
  militiaUp(g, col, v){ militiaman(g, col, v, false); },
  spear(g, col, v){ spearman(g, col, v, true); },
  spearUp(g, col, v){ spearman(g, col, v, false); },
  sword(g, col, v){
    stick(g, 0.24, -0.02, 0.31, -0.72, 0.03, SHINE); stick(g, 0.18, -0.05, 0.3, -0.07, 0.03, WOOD);   // клинок и гарда
    shoulders(g, CLOTH[v]);
    ell(g, 0.22, 0.02, 0.075, 0.075, col); ell(g, -0.22, 0.02, 0.075, 0.075, col);              // наплечники
    ell(g, -0.06, -0.21, 0.26, 0.09, col, -0.12); ell(g, -0.06, -0.21, 0.035, 0.035, SHINE);    // большой щит
    helmet(g, v);
  },
  pikeDown(g, col, v){ pikeman(g, col, v, 0.12); },
  pikeDown2(g, col, v){ pikeman(g, col, v, -0.3); },     // чётные шеренги — пика слева: ёж из пик, а не одна линия
  pikeUp(g, col, v){
    shoulders(g, CLOTH[v]);
    ell(g, 0.22, 0.02, 0.07, 0.07, col); ell(g, -0.22, 0.02, 0.07, 0.07, col);
    helmet(g, v);
    stick(g, 0.14, -0.02, 0.17, -0.34, 0.04, WOOD); ell(g, 0.17, -0.36, 0.035, 0.035, SHINE);   // пика стоймя — видна торцом
  },
  bow(g, col, v){
    g.fillStyle = "#8a6a45"; g.strokeStyle = INK; g.lineWidth = 0.03;                           // колчан за спиной
    g.beginPath(); g.rect(0.1, 0.08, 0.12, 0.26); g.fill(); g.stroke();
    ell(g, 0.13, 0.08, 0.025, 0.025, "#f1ede4", 0, false); ell(g, 0.19, 0.09, 0.025, 0.025, "#f1ede4", 0, false);
    shoulders(g, ["#c4c3b0", "#bdbca8", "#cccbb9"][v]);
    g.beginPath(); g.moveTo(-0.3, -0.17); g.quadraticCurveTo(0, -0.55, 0.3, -0.17);               // лук
    g.strokeStyle = INK; g.lineWidth = 0.075; g.stroke(); g.strokeStyle = WOOD; g.lineWidth = 0.045; g.stroke();
    g.beginPath(); g.moveTo(-0.3, -0.17); g.lineTo(0.3, -0.17); g.strokeStyle = "#efe9dc"; g.lineWidth = 0.015; g.stroke();
    stick(g, 0, -0.08, 0, -0.5, 0.015, "#efe9dc");                                               // стрела на тетиве
    ell(g, 0, 0, 0.12, 0.12, col); ell(g, 0, 0.035, 0.07, 0.06, "#00000022", 0, false);          // капюшон цвета отряда
  },
  crossbow(g, col, v){
    g.fillStyle = col; g.strokeStyle = INK; g.lineWidth = 0.035;                                  // павеза за спиной
    g.beginPath(); g.rect(-0.28, 0.13, 0.56, 0.17); g.fill(); g.stroke();
    shoulders(g, CLOTH[v]);
    stick(g, 0.04, 0.02, 0.04, -0.55, 0.06, WOOD);                                               // ложе
    g.beginPath(); g.moveTo(-0.24, -0.47); g.quadraticCurveTo(0.04, -0.62, 0.32, -0.47);          // дуга
    g.strokeStyle = INK; g.lineWidth = 0.07; g.stroke(); g.strokeStyle = STEEL; g.lineWidth = 0.04; g.stroke();
    helmet(g, v);
  },
  lance(g, col, v){ horseman(g, col, v, false); },
  barded(g, col, v){ horseman(g, col, v, true); },
};
// Копьё: передние две шеренги держат его вперёд, задние — стоймя (видно торцом), иначе строй — частокол
function spearOf(g, down){
  if(down){ stick(g, 0.2, 0.3, 0.2, -1.25, 0.035, WOOD); tip(g, 0.2, -1.25, 0.18); }
}
function spearUpOf(g, down){
  if(!down){ stick(g, 0.2, -0.02, 0.23, -0.3, 0.035, WOOD); ell(g, 0.23, -0.32, 0.03, 0.03, SHINE); }
}
function militiaman(g, col, v, down){
  spearOf(g, down);
  shoulders(g, ["#b9a98c", "#a99a7e", "#c4b597"][v]);
  ell(g, -0.21, 0.02, 0.07, 0.07, col);                                      // повязка цвета отряда на плече
  ell(g, 0, 0, 0.115, 0.115, HAIR[v]);                                       // без шлема
  spearUpOf(g, down);
}
function spearman(g, col, v, down){
  spearOf(g, down);
  shoulders(g, CLOTH[v]);
  ell(g, -0.12, -0.25, 0.22, 0.065, col, -0.18); ell(g, -0.12, -0.25, 0.03, 0.03, SHINE);   // щит перед грудью, с умбоном
  helmet(g, v);
  spearUpOf(g, down);
}
function pikeman(g, col, v, px){
  stick(g, px, 0.7, px, -4.2, 0.04, WOOD); tip(g, px, -4.2, 0.22);
  shoulders(g, CLOTH[v]);
  ell(g, 0.22, 0.02, 0.07, 0.07, col); ell(g, -0.22, 0.02, 0.07, 0.07, col);
  helmet(g, v);
}

// Всадник: конь сверху — вытянутое тело, шея с головой вперёд, хвост; попона или полная броня коня — цвет отряда
function horseman(g, col, v, barded){
  const hc = HORSE[v * 2 % HORSE.length];
  g.beginPath(); g.moveTo(0, 0.88); g.quadraticCurveTo(0.08, 1.1, 0.03, 1.32);                    // хвост
  g.strokeStyle = INK; g.lineWidth = 0.12; g.stroke(); g.strokeStyle = "#2a211b"; g.lineWidth = 0.08; g.stroke();
  ell(g, 0, 0.1, 0.27, 0.85, hc);                                                                // туловище
  ell(g, 0, -0.86, 0.11, 0.32, barded ? STEEL : hc);                                             // шея и голова
  ell(g, -0.06, -1.15, 0.03, 0.05, barded ? STEEL : hc); ell(g, 0.06, -1.15, 0.03, 0.05, barded ? STEEL : hc);   // уши
  if(!barded) stick(g, 0, -0.62, 0, -1.02, 0.05, "#2a211b");                                    // грива
  if(barded){ ell(g, 0, 0.12, 0.31, 0.78, col); ell(g, 0, 0.12, 0.2, 0.62, "#ffffff22", 0, false); }
  else ell(g, 0, 0.08, 0.31, 0.38, col);                                                         // попона под седлом
  stick(g, 0.2, 0.55, 0.2, -2.6, 0.04, WOOD); tip(g, 0.2, -2.6, 0.2);                           // копьё
  g.beginPath(); g.moveTo(0.22, -2.3); g.lineTo(0.42, -2.22); g.lineTo(0.22, -2.12); g.closePath(); // флажок
  g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.02; g.stroke();
  ell(g, 0, 0, 0.25, 0.13, mix(CLOTH[v], col, 0.3));                                            // всадник
  ell(g, -0.23, -0.03, 0.06, 0.15, col);                                                         // щит
  helmet(g, v);
}

const SPR = new Map();
function sprite(look, col, v){
  const q = Math.pow(1.2, Math.round(Math.log(view.s) / Math.log(1.2)));   // приближение ступеньками — меньше перерисовок
  const key = `${look}|${col}|${v}|${q.toFixed(3)}`;
  let sp = SPR.get(key);
  if(sp) return sp;
  const [x0, y0, x1, y1] = BOX[look], k = Math.min(q, 90) * (window.devicePixelRatio || 1);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil((x1 - x0) * k)); c.height = Math.max(1, Math.ceil((y1 - y0) * k));
  const g = c.getContext("2d");
  g.scale(k, k); g.translate(-x0, -y0); g.lineJoin = "round"; g.lineCap = "round";
  TINT = col; PAINT[look](g, col, v); TINT = null;
  if(SPR.size > 600) SPR.clear();
  sp = {c, x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  SPR.set(key, sp);
  return sp;
}

// Фигурка: бойцы по сетке pm × rd, спереди назад; в неполном ряду — по центру
function drawMen(u, [w, d, men, rank], fx, fy, h, col, moving, t, k){
  const pm = u.pm || 1, rd = u.rd || 1, look = lookOf(u);
  const cols = Math.max(1, Math.round(w / pm)), rows = Math.max(1, Math.round(d / rd));
  if(!u.fd) u.fd = Math.max(...u.figs.map(q => Math.round(q[1] / rd)));
  ctx.save(); ctx.translate(X(fx), Y(fy)); ctx.rotate(h); ctx.scale(view.s, view.s);
  let left = Math.round(men ?? cols * rows);
  for(let j = 0; j < rows && left > 0; j++){
    const n = Math.min(cols, left), off = (cols - n) / 2; left -= n;
    const manRank = (rank ?? 0) * u.fd + j;
    const pose = poseOf(look, manRank);
    for(let i = 0; i < n; i++){
      const seed = u.id * 7919 + k * 64 + j * 8 + i;
      const r1 = hash(seed, 1), r2 = hash(seed, 2), r3 = hash(seed, 3);
      let x = -w / 2 + (off + i + 0.5) * pm + (r1 - 0.5) * 0.12 * pm;
      let y = -d / 2 + (j + 0.5) * rd + (r2 - 0.5) * 0.12 * rd;
      if(moving){ const ph = r3 * 6.283; y += Math.sin(t * 11 + ph) * 0.05; x += Math.cos(t * 5.5 + ph) * 0.025; }
      const sp = sprite(pose, col, Math.floor(r3 * 3));
      ctx.drawImage(sp.c, x + sp.x, y + sp.y, sp.w, sp.h);
    }
  }
  ctx.restore();
}

// ── павшие и кровь (Г67; по мотивам «hit visuals» автора Iron Kings — рисунок свой) ──
// Под павшим — лужа (три неровных пятна, растекается за ~1 с), брызги — по направлению удара, за спину.
// Сам павший — тот же боец, обесцвеченный в цвет своей стороны, лежит, как упал. Удар в голову — кровь на голове.
const BLOOD = "#7b1212";
function mix(a, b, k){
  const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
function drawDead(){
  if(!S.dead) return;
  const now = frame, near = view.s >= MEN_FROM;
  ctx.fillStyle = BLOOD;
  for(const [x, y, fi, ui, fc, dir, part] of S.dead){
    if(fi > now) continue;
    const px = X(x), py = Y(y);
    if(!near){ ctx.fillRect(px - 0.8, py - 0.8, 1.6, 1.6); continue; }
    const seed = (fi * 131 + ui * 7919 + Math.round(x * 13) + Math.round(y * 7)) | 0;
    const g = Math.min(1, 0.25 + (now - fi) * S.dt / 1.2), a = dir * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const big = part === 3 ? 1.7 : part === 0 ? 0.65 : part === 2 ? 0.85 : 1;
    for(let k = 0; k < 3; k++){
      const r = (0.15 + 0.13 * hash(seed, k)) * big * g * view.s, off = (0.1 + 0.25 * hash(seed, k + 7)) * g;   // лужа — с тело бойца, не больше
      const ox = (ca * off + (hash(seed, k + 3) - 0.5) * 0.3) * view.s, oy = (sa * off + (hash(seed, k + 5) - 0.5) * 0.3) * view.s;
      ctx.beginPath(); ctx.ellipse(px + ox, py + oy, r, r * (0.65 + 0.35 * hash(seed, k + 9)), a, 0, 6.283); ctx.fill();
    }
    const n = 2 + Math.floor(hash(seed, 11) * 4);
    for(let k = 0; k < n; k++){
      const d = (0.55 + 1.3 * hash(seed, 20 + k)) * g, sp = (hash(seed, 30 + k) - 0.5) * 0.8;
      ctx.beginPath(); ctx.arc(px + Math.cos(a + sp) * d * view.s, py + Math.sin(a + sp) * d * view.s, Math.max(0.6, (0.05 + 0.08 * hash(seed, 40 + k)) * view.s), 0, 6.283); ctx.fill();
    }
  }
  if(!near) return;
  for(const [x, y, fi, ui, fc, dir, part] of S.dead){
    if(fi > now) continue;
    const u = S.units[ui], col = mix(COLORS[ui % COLORS.length], "#8b8781", 0.7), sp = sprite(poseOf(lookOf(u), 0), col, 0);
    ctx.save(); ctx.translate(X(x), Y(y)); ctx.rotate(fc * Math.PI / 180); ctx.scale(view.s, view.s); ctx.globalAlpha = 0.85;
    ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h);
    if(part === 0){ ctx.globalAlpha = 1; ctx.fillStyle = BLOOD; ctx.beginPath(); ctx.arc(0, 0, 0.13, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
}

// Знамя отряда (Г7): в центре строя, ближе к первой шеренге; рисуется в пикселях — видно с любого приближения
function drawBanner(f, h, depth, col){
  const bx = X(f[0] + Math.sin(h) * depth * 0.2), by = Y(f[1] - Math.cos(h) * depth * 0.2);
  const s = Math.min(1.6, Math.max(0.8, view.s / 12));
  ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -26); ctx.stroke();
  ctx.strokeStyle = WOOD; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(17, -25); ctx.lineTo(13, -19.5); ctx.lineTo(17, -14); ctx.lineTo(0, -14); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(1.5, -21, 9, 2.2);
  ctx.restore();
}

function drawFlow(u){
  if(!u || !u.flow) return;
  const cw = S.w / S.cols, ch = S.h / S.rows, step = Math.max(1, Math.round(16 / (cw * view.s)));
  ctx.strokeStyle = "rgba(30,30,30,.45)"; ctx.lineWidth = 1;
  for(let y = Math.floor(step / 2); y < S.rows; y += step) for(let x = Math.floor(step / 2); x < S.cols; x += step){
    const c = u.flow[y * S.cols + x];
    if(c === "." || c === "T") continue;
    const k = c.charCodeAt(0) - 48, dx = DX[k], dy = DY[k], l = Math.hypot(dx * cw, dy * ch);
    const cx = X((x + 0.5) * cw), cy = Y((y + 0.5) * ch), L = Math.min(7, step * cw * view.s * 0.4), ux = dx * cw / l, uy = dy * ch / l;
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
    ctx.lineTo(cx + ux * L - (ux * 3 - uy * 2.5), cy + uy * L - (uy * 3 + ux * 2.5));
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - (ux * 3 + uy * 2.5), cy + uy * L - (uy * 3 - ux * 2.5));
    ctx.stroke();
  }
}

// места в строю: по раскладке фигурок вокруг центра (сетка, как Formation.Layout) — пунктирный контур строя
function drawSlots(u, f, col){
  const h = f[2] * Math.PI / 180, c = Math.cos(h), s = Math.sin(h), fw = u.front / 2, dd = u.depth / 2;
  const pts = [[-fw, -dd], [fw, -dd], [fw, dd], [-fw, dd]].map(([lx, ly]) => [f[0] + lx * c - ly * s, f[1] + lx * s + ly * c]);
  ctx.setLineDash([3, 3]); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}

function showLog(time){
  const done = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9));
  let html = "";
  for(let t = 0; t < done; t++) html += `<p><b>Ход ${t + 1}</b></p>` + S.logs[t].map(l => `<p>${esc(l)}</p>`).join("");
  if(!done) html = `<p class="note">Строки журнала появятся в конце хода.</p>`;
  if($("log").dataset.n !== String(done)){ $("log").innerHTML = html; $("log").dataset.n = done; }
}
function showUnits(fr){
  $("units").innerHTML = S.units.map((u, i) => {
    const v = fr[i][3], kind = {infantry:"пехота", pike:"пикинёры", archer:"стрелки", cavalry:"конница"}[u.type] || u.type;
    const now = S.soldiers ? S.soldiers[Math.min(S.soldiers.length - 1, Math.round(frame))][i] : null;
    return `<div class="unit${i === sel ? " sel" : ""}" data-i="${i}"><span class="sw" style="background:${COLORS[i % COLORS.length]}"></span>
      <span>${esc(u.name)}</span><small>${kind}, ${now !== null ? `в строю ${now} из ${u.men}` : `${u.men} чел.`}, фронт ${u.front} × ${u.depth} м · норма ${u.norm} м · сейчас ${(v).toFixed(1).replace(".", ",")} м нормы/с${u.note ? " · " + esc(u.note) : ""}</small></div>`;
  }).join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(i){
  S = DATA.scenes[i]; sel = 0; frame = 0; playing = false; $("play").textContent = "▶";
  $("note").textContent = S.note;
  $("slider").max = S.frames.length - 1;
  $("log").dataset.n = "";
  document.querySelectorAll("#tabs button").forEach((b, k) => b.classList.toggle("on", k === i));
  bakeTerrain(); fit(); draw();
}

let last = 0;
function tick(ts){
  if(playing){
    const dt = last ? (ts - last) / 1000 : 0;
    frame = Math.min(S.frames.length - 1, frame + dt * speed / S.dt);
    if(frame >= S.frames.length - 1){ playing = false; $("play").textContent = "▶"; }
    draw();
  }
  last = ts; requestAnimationFrame(tick);
}

if(!DATA){
  document.body.innerHTML = `<p style="padding:24px">Нет данных. Запусти из папки core: <code>dotnet run --project Tests -- polygon</code> и открой core/polygon/polygon.html.</p>`;
} else {
  $("tabs").innerHTML = DATA.scenes.map((s, i) => `<button>${esc(s.name)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b, i) => b.onclick = () => load(i));
  $("made").textContent = "Записано: " + DATA.made;
  $("play").onclick = () => { if(frame >= S.frames.length - 1) frame = 0; playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; };
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
    speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("slider").oninput = e => { frame = +e.target.value; draw(); };
  ["showMen", "showRoute", "showFlow", "showSlots"].forEach(id => $(id).onchange = draw);
  $("units").onclick = e => { const el = e.target.closest(".unit"); if(el){ sel = +el.dataset.i; draw(); } };
  addEventListener("keydown", e => {
    if(e.code === "Space"){ e.preventDefault(); $("play").click(); }
    if(e.code === "ArrowRight"){ frame = Math.min(S.frames.length - 1, Math.floor(frame) + 1); draw(); }
    if(e.code === "ArrowLeft"){ frame = Math.max(0, Math.ceil(frame) - 1); draw(); }
  });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    view.ox = mx - (mx - view.ox) * k; view.oy = my - (my - view.oy) * k; view.s *= k; draw();
  }, {passive: false});
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(drag){ view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y; draw(); } });
  cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("dblclick", () => { fit(); draw(); });
  addEventListener("resize", () => { fit(); draw(); });
  load(0);
  requestAnimationFrame(tick);
}
</script>
</body>
