<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон движения</title>
<!-- Шаблон полигона (Г55). Данные подставляет dotnet run --project Tests -- polygon → core/polygon/polygon.html -->
<style>
:root{
  --bg:#f4f1e8; --panel:#fbfaf5; --ink:#24221d; --muted:#6b675c; --line:#d9d3c2; --accent:#8a5a1f; --chip:#ece6d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#17161a; --panel:#201f24; --ink:#ebe8df; --muted:#a29d90; --line:#36343b; --accent:#e0a85a; --chip:#2b2a30; color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
body{ display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header{ display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1{ font-size:16px; margin:0 8px 0 0; font-weight:650; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
button{ font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
button.on{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
main{ display:grid; grid-template-columns:1fr 340px; min-height:0; }
#wrap{ position:relative; min-width:0; min-height:0; }
canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
canvas.drag{ cursor:grabbing; }
aside{ border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; }
aside h2{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
.note{ color:var(--muted); margin:0; }
.unit{ display:grid; grid-template-columns:14px 1fr; gap:2px 8px; padding:6px; border-radius:6px; cursor:pointer; }
.unit:hover{ background:var(--chip); }
.unit.sel{ outline:1px solid var(--accent); }
.sw{ width:12px; height:12px; border-radius:3px; margin-top:3px; }
.unit small{ grid-column:2; color:var(--muted); }
label{ display:flex; gap:6px; align-items:center; margin:3px 0; }
.log p{ margin:0 0 4px; font-size:13px; }
.log b{ color:var(--accent); font-weight:600; }
footer{ display:flex; gap:10px; align-items:center; padding:8px 16px; border-top:1px solid var(--line); }
#time{ min-width:120px; font-variant-numeric:tabular-nums; }
#slider{ flex:1; accent-color:var(--accent); }
.hint{ position:absolute; left:10px; bottom:8px; color:var(--muted); font-size:12px; background:var(--panel); padding:2px 6px; border-radius:4px; opacity:.85; }
@media (max-width:760px){
  main{ grid-template-columns:1fr; grid-template-rows:55vh auto; }
  aside{ border-left:none; border-top:1px solid var(--line); }
  footer{ flex-wrap:wrap; }
}
</style>
</head>
<body>
<header>
  <h1>Полигон движения</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div class="hint">колесо — приближение · тянуть — сдвиг · двойной щелчок — вся карта · пробел — пауза</div></div>
  <aside>
    <p class="note" id="note"></p>
    <h2>Отряды</h2><div id="units"></div>
    <h2>Показать</h2>
    <label><input type="checkbox" id="showMen" checked> человечки вблизи (иначе плашки)</label>
    <label><input type="checkbox" id="showRoute" checked> путь и цель</label>
    <label><input type="checkbox" id="showFlow"> карта направлений выбранного отряда</label>
    <label><input type="checkbox" id="showSlots"> места в строю</label>
    <label><input type="checkbox" id="showGrid" checked> тетрадная клетка 10 м</label>
    <label><input type="checkbox" id="greyMen"> серые фигурки (Г7; иначе тело в цвете стороны)</label>
    <h2>Журнал</h2><div class="log" id="log"></div>
    <p class="note" id="made"></p>
  </aside>
</main>
<footer>
  <button id="play">▶</button>
  <button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  <span id="time"></span>
  <input type="range" id="slider" min="0" value="0" step="1">
</footer>
<script>
const DATA = /*DATA*/null;
// цвет стороны (В4): отряды одной фракции — оттенки её цвета, чтобы свои различались, а стороны читались сразу
const SIDE = {1: ["#b5372b", "#c8662c", "#9b2d52", "#cf8f2e", "#8a2c2a", "#d4573c"], 2: ["#2f63a8", "#2c8b9e", "#5a4aa2", "#4583c8", "#27497f", "#5b7fb6"],
  3: ["#2f7d4a", "#4f9a3a", "#24685e", "#6f9a2e"], 4: ["#c9a227", "#d9c04a", "#a8841c", "#e0b84e"]};
function sideColor(i){
  const f = S.units[i].faction || 1, pal = SIDE[f] || SIDE[1];
  let k = 0;
  for(let j = 0; j < i; j++) if((S.units[j].faction || 1) === f) k++;
  return pal[k % pal.length];
}
const DX = [-1,0,1,-1,1,-1,0,1], DY = [-1,-1,-1,0,0,1,1,1];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, sel = 0, frame = 0, playing = false, speed = 1, view = null;

function decode(str, n){
  const out = new Uint8Array(n); let p = 0;
  if(!str) return out;
  for(const run of str.split(",")){ const [v, c] = run.split(".").map(x => parseInt(x, 36)); out.fill(v, p, p + c); p += c; }
  return out;
}
// ══ Земля и постройки (В1–В3): облик в духе Iron Kings — идеи, рисунок свой (Г10) ══
// Карта рисуется плитками 256 px под ступень приближения (×2) и копится в кэше; пока плитки нет — видна плитка
// ступенью крупнее или общая карта. Плитка — в два прохода. Попиксельно: земля с неровными краями (граница клеток 5 м
// плюс шум), тёмная кромка воды, обочины, светотень холмов и горизонтали. Векторно: тетрадная клетка, трава, рябь,
// тени, мосты, частокол, стены с зубцами, ворота, пролом, камни, кусты, деревья, дома, башни. Сверху — зерно бумаги.
// Свет — справа сверху, тени ложатся влево вниз. Рисунок не трогает правила: клетки те же, что у движка.
const TILE = 256, SHB = 24, SH_X = -0.6, SH_Y = 0.8;
// под постройкой: стена, башня, дом, пролом — поле, ворота — дорога, мост — вода
const UNDER = {0: 1, 9: 7, 12: 1, 13: 2, 14: 1, 15: 1, 18: 1, 20: 1};
// цвет земли и неровность края (0 — край ровно по клеткам)
const GROUND = {1: ["#9ca86c", .28], 2: ["#b9a072", .16], 3: ["#dccb98", .3], 4: ["#eceff2", .3], 5: ["#919f62", .34],
  6: ["#6a7f4c", .3], 7: ["#5b8aa5", .2], 8: ["#88aebd", .14], 10: ["#77885f", .3], 11: ["#9a968b", .3],
  16: ["#587a7b", .06], 17: ["#977d59", .05], 19: ["#b4ad9f", 0]};
const GR = new Float32Array(21), GG = new Float32Array(21), GB = new Float32Array(21), AMP = new Float32Array(21), WETA = new Uint8Array(21);
for(let k = 0; k <= 20; k++){
  const [hex, a] = GROUND[k] || GROUND[1];
  GR[k] = parseInt(hex.slice(1, 3), 16); GG[k] = parseInt(hex.slice(3, 5), 16); GB[k] = parseInt(hex.slice(5, 7), 16);
  AMP[k] = a; WETA[k] = k === 7 || k === 8 || k === 16 ? 1 : 0;
}
// кроны: тень-контур, основной тон, середина, блик
const TREES = [["#2f3d24", "#3e5c34", "#557a3e", "#74984e"], ["#33401f", "#46622f", "#5f7f3a", "#86a052"],
  ["#2c3b2c", "#3a5940", "#4f744c", "#6d9466"], ["#4a4320", "#76702f", "#958c3c", "#b8ac58"]];
const BUSH = ["#36452a", "#5e8040", "#78994e", "#9ab868"];
const ROOFS = ["#ad5a3c", "#c3a468", "#6c7480", "#8c6846"];   // черепица, солома, сланец, дранка
let SHOW_GRID = true, MAP = null, OVER = null, want = [];
const TILES = new Map();

// шум для неровных краёв и пятен: значения в узлах решётки, плавно между ними
function h2(x, y, s){
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vn(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = h2(ix, iy, s), b = h2(ix + 1, iy, s), c = h2(ix, iy + 1, s), d = h2(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// какой вид земли в точке: доля каждого вида среди четырёх ближних клеток плюс шум — край идёт по границе клеток, но живой
let PICK_M = 1;
function pick(a, b, cc, d, w00, w10, w01, w11, wx, wy, fine){
  let best = a, bs = -9, ss = -9;
  for(let q = 0; q < 4; q++){
    const k = q === 0 ? a : q === 1 ? b : q === 2 ? cc : d;
    if((q > 0 && k === a) || (q > 1 && k === b) || (q > 2 && k === cc)) continue;
    let s = (a === k ? w00 : 0) + (b === k ? w10 : 0) + (cc === k ? w01 : 0) + (d === k ? w11 : 0);
    const amp = AMP[k];
    if(amp) s += amp * (1.2 * vn(wx / 5.5 + k * 7.3, wy / 5.5 - k * 3.1, k) + (fine ? 0.8 * vn(wx / 1.9 + k * 5.1, wy / 1.9, k + 40) : 0.4) - 1);
    if(s > bs){ ss = bs; bs = s; best = k; } else if(s > ss) ss = s;
  }
  PICK_M = bs - ss;
  return best;
}
function classAt(wx, wy){
  const {gt, cols, rows, c} = MAP, fx = wx / c - 0.5, fy = wy / c - 0.5, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
  const x0 = Math.max(0, Math.min(cols - 1, ix)), x1 = Math.max(0, Math.min(cols - 1, ix + 1));
  const y0 = Math.max(0, Math.min(rows - 1, iy)), y1 = Math.max(0, Math.min(rows - 1, iy + 1));
  const a = gt[y0 * cols + x0], b = gt[y0 * cols + x1], cc = gt[y1 * cols + x0], d = gt[y1 * cols + x1];
  if(a === b && a === cc && a === d) return a;
  return pick(a, b, cc, d, (1 - tx) * (1 - ty), tx * (1 - ty), (1 - tx) * ty, tx * ty, wx, wy, true);
}

// Подготовка сцены: виды земли, сглаженная высота, укрепления линиями, башни и дома кусками
function prepMap(){
  const cols = S.cols, rows = S.rows, n = cols * rows, c = S.w / cols;
  const t = decode(S.t, n), z = decode(S.z, n), gt = new Uint8Array(n), zb = new Float32Array(n);
  for(let i = 0; i < n; i++){ const k = t[i]; gt[i] = UNDER[k] ?? (GROUND[k] ? k : 1); }
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){   // высота для светотени — сглаженная 3 × 3
    let s = 0, m = 0;
    for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
      const xx = x + dx, yy = y + dy;
      if(xx >= 0 && yy >= 0 && xx < cols && yy < rows){ s += z[yy * cols + xx]; m++; }
    }
    zb[y * cols + x] = s / m;
  }
  const at = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows ? 0 : t[y * cols + x];
  // материал укрепления: 1 — камень, 2 — частокол, 3 — окоп; ворота и башни — как их соседи
  const mat = new Uint8Array(n);
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const i = y * cols + x, k = t[i];
    if(k === 12) mat[i] = 1; else if(k === 15) mat[i] = 2; else if(k === 17) mat[i] = 3;
    else if(k === 13 || k === 14){
      let s = 0, p = 0;
      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++){ const q = at(x + dx, y + dy); if(q === 12) s++; else if(q === 15) p++; }
      mat[i] = p > s ? 2 : 1;
    }
  }
  const matAt = (x, y) => x < 0 || y < 0 || x >= cols || y >= rows ? 0 : mat[y * cols + x];
  // середины клеток укреплений, дважды сглаженные по соседям: лесенка из клеток становится плавной линией
  let px = new Float32Array(n), py = new Float32Array(n);
  for(let i = 0; i < n; i++){ px[i] = (i % cols + 0.5) * c; py[i] = (Math.floor(i / cols) + 0.5) * c; }
  for(let it = 0; it < 2; it++){
    const nx = px.slice(), ny = py.slice();
    for(let i = 0; i < n; i++){
      const m = mat[i]; if(!m) continue;
      const x = i % cols, y = (i - x) / cols;
      let sx = 2 * px[i], sy = 2 * py[i], w = 2;
      for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
        if((dx || dy) && matAt(x + dx, y + dy) === m){ const j = (y + dy) * cols + x + dx; sx += px[j]; sy += py[j]; w++; }
      }
      nx[i] = sx / w; ny[i] = sy / w;
    }
    px = nx; py = ny;
  }
  // связи: вправо, вниз и по диагонали (диагональ — только если угол не закрыт клеткой того же укрепления)
  const lines = {1: new Path2D(), 2: new Path2D(), 3: new Path2D()}, deg = new Uint8Array(n);
  for(let i = 0; i < n; i++){
    const m = mat[i]; if(!m) continue;
    const x = i % cols, y = (i - x) / cols;
    for(const [dx, dy] of [[1, 0], [0, 1], [1, 1], [-1, 1]]){
      if(matAt(x + dx, y + dy) !== m) continue;
      if(dx && dy && (matAt(x + dx, y) === m || matAt(x, y + dy) === m)) continue;
      const j = (y + dy) * cols + x + dx;
      lines[m].moveTo(px[i], py[i]); lines[m].lineTo(px[j], py[j]); deg[i]++; deg[j]++;
    }
  }
  for(let i = 0; i < n; i++) if(mat[i] && !deg[i]){ lines[mat[i]].moveTo(px[i], py[i]); lines[mat[i]].lineTo(px[i] + 0.01, py[i]); }
  const gates = [], rubble = [];
  for(let i = 0; i < n; i++){
    const x = i % cols, y = (i - x) / cols;
    if(t[i] === 13) gates.push({x: px[i], y: py[i], horiz: matAt(x - 1, y) === mat[i] || matAt(x + 1, y) === mat[i], m: mat[i]});
    if(t[i] === 20) rubble.push({x: (x + 0.5) * c, y: (y + 0.5) * c, i});
  }
  // связные куски одного вида: башни (по 8 соседям), дома и мосты (по 4)
  const comps = (kind, diag) => {
    const seen = new Uint8Array(n), out = [];
    for(let s = 0; s < n; s++){
      if(t[s] !== kind || seen[s]) continue;
      const cells = [], st = [s]; seen[s] = 1;
      while(st.length){
        const i = st.pop(), x = i % cols, y = (i - x) / cols; cells.push([x, y]);
        for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){
          if(!(dx || dy) || (!diag && dx && dy) || at(x + dx, y + dy) !== kind) continue;
          const j = (y + dy) * cols + x + dx;
          if(!seen[j]){ seen[j] = 1; st.push(j); }
        }
      }
      const xs = cells.map(q => q[0]), ys = cells.map(q => q[1]);
      out.push({cells, i: s, x0: Math.min(...xs) * c, y0: Math.min(...ys) * c, x1: (Math.max(...xs) + 1) * c, y1: (Math.max(...ys) + 1) * c});
    }
    return out;
  };
  // башня — круг по короткой стороне куска; слипшиеся башни (кусок вытянут) делятся на несколько
  const towers = comps(14, true).flatMap(q => {
    const w = q.x1 - q.x0, h = q.y1 - q.y0, s = Math.min(w, h), parts = Math.max(1, Math.round(Math.max(w, h) / s));
    return Array.from({length: parts}, (_, k) => ({...q, i: q.i + k, m: mat[q.i], r: s * 0.52 + 0.3,
      x: w >= h ? q.x0 + (k + 0.5) * w / parts : (q.x0 + q.x1) / 2, y: w >= h ? (q.y0 + q.y1) / 2 : q.y0 + (k + 0.5) * h / parts}));
  });
  const houses = comps(18, false).flatMap(q => {
    const full = q.cells.length >= 0.8 * ((q.x1 - q.x0) / c) * ((q.y1 - q.y0) / c);
    return full ? [{...q, n: q.cells.length}] : q.cells.map(([x, y]) => ({x0: x * c, y0: y * c, x1: (x + 1) * c, y1: (y + 1) * c, i: y * cols + x, n: 1}));
  });
  const bridges = comps(9, false).map(q => {
    const span = new Set(q.cells.map(p => p[1])).size >= new Set(q.cells.map(p => p[0])).size;   // через реку с севера на юг
    return {...q, vert: span, set: new Set(q.cells.map(([x, y]) => y * cols + x))};
  });
  MAP = {t, z, zb, gt, cols, rows, c, lines, gates, rubble, towers, houses, bridges,
    rustic: t.some(k => k === 15),                            // в остроге — соломенные и тесовые крыши
    towerRoof: hash(cols * 31 + rows, 4) < 0.5 ? ROOFS[0] : ROOFS[2]};   // у башен одного замка — одна кровля
}

// Плитка: попиксельно земля, векторно всё остальное, сверху зерно
const SHC = document.createElement("canvas"); SHC.width = SHC.height = TILE + 2 * SHB;
const GRAIN = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  for(let i = 0; i < 2800; i++){
    const x = Math.floor(hash(i, 91) * 256), y = Math.floor(hash(i, 92) * 256), s = hash(i, 93), a = (0.08 + 0.14 * hash(i, 94)).toFixed(3);
    g.fillStyle = s < 0.72 ? `rgba(40,32,18,${a})` : `rgba(255,250,232,${a})`;
    const w = s < 0.1 ? 2 : 1; g.fillRect(x, y, w, w);
  }
  return c;
})();
function makeTile(L, tx, ty){
  const c = document.createElement("canvas"); c.width = c.height = TILE;
  const g = c.getContext("2d"), span = TILE / L, wx0 = tx * span, wy0 = ty * span;
  groundPass(g, L, wx0, wy0);
  vectorPass(g, L, wx0, wy0);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.fillStyle = g.createPattern(GRAIN, "repeat"); g.fillRect(0, 0, TILE, TILE);
  return c;
}

function groundPass(g, L, wx0, wy0){
  const {gt, z, zb, cols, rows, c} = MAP, inv = 1 / L, fine = L >= 2;
  const E = Math.max(1, Math.min(4, Math.round(0.3 * L))), N = TILE + 2 * E;
  const cls = new Uint8Array(N * N), mar = new Float32Array(N * N), zs = new Float32Array(N * N), zh = new Float32Array(N * N);
  for(let py = 0; py < N; py++){
    const wy = wy0 + (py - E + 0.5) * inv, fy = wy / c - 0.5, iy = Math.floor(fy), ty = fy - iy;
    const r0 = Math.max(0, Math.min(rows - 1, iy)) * cols, r1 = Math.max(0, Math.min(rows - 1, iy + 1)) * cols;
    for(let px = 0; px < N; px++){
      const wx = wx0 + (px - E + 0.5) * inv, fx = wx / c - 0.5, ix = Math.floor(fx), tx = fx - ix;
      const x0 = Math.max(0, Math.min(cols - 1, ix)), x1 = Math.max(0, Math.min(cols - 1, ix + 1)), o = py * N + px;
      const i00 = r0 + x0, i10 = r0 + x1, i01 = r1 + x0, i11 = r1 + x1;
      const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
      zs[o] = z[i00] * w00 + z[i10] * w10 + z[i01] * w01 + z[i11] * w11;

  const x0 = H.x0 + 0.4, y0 = H.y0 + 0.4, x1 = H.x1 - 0.4, y1 = H.y1 - 0.4, w = x1 - x0, h = y1 - y0;
  const keep = H.n >= 6;
  if(keep){   // донжон: каменный квадрат с зубцами, внутри — шатровая крыша
    g.fillStyle = "#c6bfae"; g.fillRect(x0, y0, w, h); g.lineWidth = o; g.strokeStyle = INK; g.strokeRect(x0, y0, w, h);
    if(L >= 1.5){ g.lineCap = "butt"; g.setLineDash([0.75, 1.0]); g.lineWidth = 0.9; g.strokeStyle = "#8a8374"; g.strokeRect(x0 + 0.45, y0 + 0.45, w - 0.9, h - 0.9); g.setLineDash([]); g.lineCap = "round"; }
    roof(g, x0 + 1.4, y0 + 1.4, x1 - 1.4, y1 - 1.4, ROOFS[2], L, o, true);
    return;
  }
  const pal = MAP.rustic ? [ROOFS[1], ROOFS[3]] : [ROOFS[0], ROOFS[0], ROOFS[2], ROOFS[1]];
  roof(g, x0, y0, x1, y1, pal[Math.floor(hash(H.i, 3) * pal.length)], L, o, false);
}
// вальмовая крыша: конёк вдоль длинной стороны, четыре ската в два тона, ряды черепицы
function roof(g, x0, y0, x1, y1, base, L, o, tent){
  const w = x1 - x0, h = y1 - y0, wide = w >= h, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const hl = tent ? 0 : Math.abs(w - h) / 2;
  const ra = wide ? [cx - hl, cy] : [cx, cy - hl], rb = wide ? [cx + hl, cy] : [cx, cy + hl];
  const F = [
    [[[x0, y0], [x1, y0], rb, ra], 0, -1],
    [[[x1, y0], [x1, y1], rb], 1, 0],
    [[[x1, y1], [x0, y1], ra, rb], 0, 1],
    [[[x0, y1], [x0, y0], ra], -1, 0],
  ];
  // у узкого дома конёк идёт сверху вниз: верх и низ — треугольники, бока — трапеции
  if(!wide){ F[0][0] = [[x0, y0], [x1, y0], ra]; F[1][0] = [[x1, y0], [x1, y1], rb, ra]; F[2][0] = [[x1, y1], [x0, y1], rb]; F[3][0] = [[x0, y1], [x0, y0], ra, rb]; }
  for(const [pts, nx, ny] of F){
    g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath();
    g.fillStyle = facet(base, nx, ny); g.fill();
    if(L >= 3){
      g.save(); g.clip(); g.beginPath();
      if(nx === 0) for(let yy = y0 + 0.5; yy < y1; yy += 0.5){ g.moveTo(x0, yy); g.lineTo(x1, yy); }
      else for(let xx = x0 + 0.5; xx < x1; xx += 0.5){ g.moveTo(xx, y0); g.lineTo(xx, y1); }
      g.lineWidth = Math.max(0.04, 0.7 / L); g.strokeStyle = "rgba(40,24,14,.22)"; g.stroke(); g.restore();
    }
  }
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(ra[0], ra[1]); g.lineTo(rb[0], rb[1]); g.lineTo(x1, y1);
  g.moveTo(x1, y0); g.lineTo(wide ? rb[0] : ra[0], wide ? rb[1] : ra[1]); g.moveTo(x0, y1); g.lineTo(wide ? ra[0] : rb[0], wide ? ra[1] : rb[1]);
  g.lineWidth = o * 0.8; g.strokeStyle = "rgba(30,20,12,.55)"; g.stroke();
  g.lineWidth = o; g.strokeStyle = INK; g.strokeRect(x0, y0, x1 - x0, y1 - y0);
}
// башня: каменное кольцо с зубцами и конус крыши из восьми граней; у острога — деревянная вышка
function tower(g, T, L, o){
  const {x, y, r} = T;
  if(T.m === 2){
    const a = r * 0.8;
    g.fillStyle = "#8f6a42"; g.fillRect(x - a, y - a, 2 * a, 2 * a); g.lineWidth = o; g.strokeStyle = INK; g.strokeRect(x - a, y - a, 2 * a, 2 * a);
    roof(g, x - a + 0.3, y - a + 0.3, x + a - 0.3, y + a - 0.3, ROOFS[1], L, o, true);
    return;
  }
  g.beginPath(); g.arc(x, y, r + o, 0, 6.283); g.fillStyle = INK; g.fill();
  g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fillStyle = "#c6bfae"; g.fill();
  if(r * L >= 8){ g.lineCap = "butt"; g.setLineDash([0.8, 0.75]); g.beginPath(); g.arc(x, y, r - 0.45, 0, 6.283); g.lineWidth = 0.9; g.strokeStyle = "#8a8374"; g.stroke(); g.setLineDash([]); g.lineCap = "round"; }
  const rr = r * 0.74, base = MAP.towerRoof;
  for(let k = 0; k < 8; k++){
    const a0 = k * Math.PI / 4, a1 = a0 + Math.PI / 4, am = (a0 + a1) / 2;
    g.beginPath(); g.moveTo(x, y); g.arc(x, y, rr, a0, a1); g.closePath();
    g.fillStyle = facet(base, Math.cos(am), Math.sin(am)); g.fill();
  }
  g.beginPath(); for(let k = 0; k < 8; k++){ const a = k * Math.PI / 4; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.lineWidth = o * 0.6; g.strokeStyle = "rgba(30,20,12,.4)"; g.stroke();
  g.beginPath(); g.arc(x, y, rr, 0, 6.283); g.lineWidth = o; g.strokeStyle = INK; g.stroke();
  g.beginPath(); g.arc(x, y, Math.max(0.3, r * 0.08), 0, 6.283); g.fillStyle = "#d6b75a"; g.fill(); g.lineWidth = o * 0.7; g.stroke();
}

// Общая карта мельче — подложка, пока плиток нужной ступени нет
function makeOverview(){
  const Lo = Math.pow(2, Math.floor(Math.log2(1024 / Math.max(S.w, S.h)))), span = TILE / Lo;
  const c = document.createElement("canvas"); c.width = Math.ceil(S.w * Lo); c.height = Math.ceil(S.h * Lo);
  const g = c.getContext("2d");
  for(let ty = 0; ty * span < S.h; ty++) for(let tx = 0; tx * span < S.w; tx++){
    const tile = makeTile(Lo, tx, ty); g.drawImage(tile, tx * TILE, ty * TILE); TILES.set(`${Lo}|${tx}|${ty}`, tile);
  }
  OVER = {c, L: Lo};
}
const levelFor = () => Math.pow(2, Math.max(-3, Math.min(6, Math.ceil(Math.log2(view.s * (window.devicePixelRatio || 1)) - 0.2))));
function drawGround(r){
  const dpr = window.devicePixelRatio || 1, mx = X(0), my = Y(0), mw = S.w * view.s, mh = S.h * view.s;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 3; ctx.fillStyle = "#9ca86c"; ctx.fillRect(mx, my, mw, mh); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(OVER.c, mx, my, OVER.c.width / OVER.L * view.s, OVER.c.height / OVER.L * view.s);
  const L = levelFor();
  want = [];
  if(L > OVER.L){
    const span = TILE / L, snap = v => Math.round(v * dpr) / dpr;
    const vx0 = Math.max(0, -view.ox / view.s), vy0 = Math.max(0, -view.oy / view.s);
    const vx1 = Math.min(S.w, (r.width - view.ox) / view.s), vy1 = Math.min(S.h, (r.height - view.oy) / view.s);
    const ccx = (vx0 + vx1) / 2, ccy = (vy0 + vy1) / 2;
    for(let ty = Math.floor(vy0 / span); ty * span < vy1; ty++) for(let tx = Math.floor(vx0 / span); tx * span < vx1; tx++){
      const key = `${L}|${tx}|${ty}`, tile = TILES.get(key);
      const ax = snap(X(tx * span)), bx = snap(X((tx + 1) * span)), ay = snap(Y(ty * span)), by = snap(Y((ty + 1) * span));
      if(tile){ TILES.delete(key); TILES.set(key, tile); ctx.drawImage(tile, ax, ay, bx - ax, by - ay); continue; }
      want.push([Math.hypot((tx + 0.5) * span - ccx, (ty + 0.5) * span - ccy), L, tx, ty]);
      const up = TILES.get(`${L / 2}|${tx >> 1}|${ty >> 1}`);   // пока нет — четверть плитки ступенью крупнее
      if(up) ctx.drawImage(up, (tx & 1) * TILE / 2, (ty & 1) * TILE / 2, TILE / 2, TILE / 2, ax, ay, bx - ax, by - ay);
    }
    want.sort((a, b) => a[0] - b[0]);
  }
  ctx.restore();
}
// дорисовать недостающие плитки — понемногу за кадр, от середины экрана
function growTiles(){
  const t0 = performance.now();
  while(want.length && performance.now() - t0 < 14){
    const [, L, tx, ty] = want.shift(), key = `${L}|${tx}|${ty}`;
    if(!TILES.has(key)) TILES.set(key, makeTile(L, tx, ty));
  }
  if(TILES.size > 240){ for(const key of TILES.keys()){ if(TILES.size <= 200) break; if(!key.startsWith(OVER.L + "|")) TILES.delete(key); } }
}
// виньетка: края поля темнее
function drawVignette(r){
  const x0 = Math.max(0, X(0)), y0 = Math.max(0, Y(0)), x1 = Math.min(r.width, X(S.w)), y1 = Math.min(r.height, Y(S.h));
  if(x1 <= x0 || y1 <= y0) return;
  const cx = r.width / 2, cy = r.height / 2, R = Math.hypot(r.width, r.height) / 2;
  const vg = ctx.createRadialGradient(cx, cy, R * 0.42, cx, cy, R * 1.05);
  vg.addColorStop(0, "rgba(46,34,14,0)"); vg.addColorStop(1, "rgba(46,34,14,.4)");
  ctx.fillStyle = vg; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}

function fit(){
  const r = cv.getBoundingClientRect(), pad = 16;
  const s = Math.min((r.width - 2 * pad) / S.w, (r.height - 2 * pad) / S.h);
  view = {s, ox: (r.width - S.w * s) / 2, oy: (r.height - S.h * s) / 2};
}
const X = x => view.ox + x * view.s, Y = y => view.oy + y * view.s;

function lerpFrame(f){
  const i = Math.floor(f), a = S.frames[i], b = S.frames[Math.min(i + 1, S.frames.length - 1)], k = f - i;
  return a.map((ua, u) => ua.map((v, j) => {
    const bj = b[u][j];
    if(bj === undefined) return v;   // бой: фигурка упала между кадрами
    if(j === 2){ let d = ((bj - v + 540) % 360) - 180; return v + d * k; }
    return v + (bj - v) * k;
  }));
}

function draw(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)){ cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  drawGround(r);
  const fr = lerpFrame(frame);

  if($("showFlow").checked) drawFlow(S.units[sel]);
  drawDead();   // павшие и кровь (Г67)
  // бой (БД1): павшие фигурки — серые крестики там, где упали (если поимённых павших нет)
  if(S.fallen && !S.dead) S.fallen.forEach(list => {
    ctx.strokeStyle = "rgba(60,50,40,.55)"; ctx.lineWidth = 1;
    list.forEach(([x, y, fi]) => {
      if(fi > frame) return;
      const px = X(x), py = Y(y), s = Math.max(1.5, 1.2 * view.s);
      ctx.beginPath(); ctx.moveTo(px - s, py - s); ctx.lineTo(px + s, py + s); ctx.moveTo(px + s, py - s); ctx.lineTo(px - s, py + s); ctx.stroke();
    });
  });
  drawVignette(r);
  S.units.forEach((u, i) => {
    const col = u.col;
    if($("showRoute").checked && u.route){
      ctx.setLineDash([6, 5]); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
      u.route.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke(); ctx.setLineDash([]);
      const [tx, ty, tf] = u.order, a = tf * Math.PI / 180;
      ctx.beginPath(); ctx.arc(X(tx), Y(ty), 4, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(tx), Y(ty)); ctx.lineTo(X(tx + Math.sin(a) * 25), Y(ty - Math.cos(a) * 25)); ctx.stroke();
    }
    const f = fr[i], h = f[2] * Math.PI / 180;
    if($("showSlots").checked) drawSlots(u, f, col);
    if($("showMen").checked && view.s >= MEN_FROM){
      // вблизи — человечки (Г32); идущий отряд шагает
      const moving = f[3] > 0.02, t = frame * S.dt;
      u.figs.forEach((fig, k) => {
        const fx = f[4 + 2 * k], fy = f[5 + 2 * k];
        if(fx === undefined) return;
        const pad = (Math.max(fig[0], fig[1]) / 2 + 5) * view.s, sx = X(fx), sy = Y(fy);   // за краем экрана не рисуем
        if(sx < -pad || sy < -pad || sx > r.width + pad || sy > r.height + pad) return;
        drawMen(u, fig, fx, fy, h, col, moving, t, k);
      });
    } else {
      // издали — плашка: фигурка одним прямоугольником
      ctx.fillStyle = col; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 0.6;
      u.figs.forEach(([w, d], k) => {
        if(f[4 + 2 * k] === undefined) return;   // бой: фигурок стало меньше (Г30)
        const x = X(f[4 + 2 * k]), y = Y(f[5 + 2 * k]);
        ctx.save(); ctx.translate(x, y); ctx.rotate(h);
        const W = Math.max(1.2, w * view.s), D = Math.max(1, d * view.s);
        ctx.fillRect(-W / 2, -D / 2, W, D); if(view.s > 2) ctx.strokeRect(-W / 2, -D / 2, W, D);
        ctx.restore();
      });
    }
    // центр строя и курс
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(X(f[0]), Y(f[1])); ctx.lineTo(X(f[0] + Math.sin(h) * (u.depth / 2 + 14)), Y(f[1] - Math.cos(h) * (u.depth / 2 + 14))); ctx.stroke();
    if($("showMen").checked && view.s >= 1.5) drawBanner(f, h, u.depth, col);   // поверх линии курса
    // карта всегда «бумажная» — подпись тёмная со светлой обводкой в любой теме
    const lx = X(f[0]) + 8, ly = Y(f[1]) + u.depth / 2 * view.s + 16;
    ctx.font = "600 12px system-ui"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,253,245,.9)"; ctx.lineWidth = 3; ctx.strokeText(u.name, lx, ly);
    ctx.fillStyle = "#1d1b16"; ctx.fillText(u.name, lx, ly);
  });
  const time = frame * S.dt, turn = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9) + 1), tin = time - (turn - 1) * S.turnSec;
  $("time").textContent = `ход ${turn} · ${tin.toFixed(1).replace(".", ",")} с`;
  $("slider").value = Math.round(frame);
  showLog(time);
  showUnits(fr);
}

// ── Человечки (Г32): фигурка 5 × 2 — десять бойцов, вид сверху. Рисунки свои (Г10) ──
// Боец рисуется в метрах, вперёд — вверх (−y). Каждый вид бойца один раз рисуется в маленький холст
// (спрайт) под текущее приближение, дальше фигурка только расставляет копии — так тысячи бойцов
// не тормозят. Разброс в осанке и место в строю «гуляют» по зерну бойца — строй выглядит живым.
const MEN_FROM = 3;   // px на метр: ближе — человечки, дальше — плашки
const INK = "#2b2621", CLOTH = ["#cfcbc2", "#c5c1b7", "#d8d4cb"], STEEL = "#a4a8ab", SHINE = "#e2e4e5", WOOD = "#7a5a36";
const HAIR = ["#6b4a2f", "#8a6a45", "#4b3a2a"], HORSE = ["#7a5233", "#4a3426", "#8b5a2b", "#9a9590", "#2f2b28", "#b08a5a"];
const LOOK_BY_TPL = {militia: "militia", infantry: "spear", guard: "sword", foot_knights: "sword", pikemen: "pike",
  militia_archers: "bow", archers: "bow", crossbowmen: "crossbow", knights: "lance", elite_cavalry: "barded"};
const LOOK_BY_TYPE = {infantry: "spear", pike: "pike", archer: "bow", cavalry: "lance"};
const lookOf = u => LOOK_BY_TPL[u.tpl] || LOOK_BY_TYPE[u.type] || "spear";
// рамка рисунка каждой позы, м: [x0, y0, x1, y1]
const BOX = {militia: [-.4, -1.5, .4, .4], militiaUp: [-.4, -.45, .4, .4], spear: [-.4, -1.5, .4, .4], spearUp: [-.4, -.45, .4, .4],
  sword: [-.4, -.9, .4, .4], bow: [-.4, -.65, .4, .4], crossbow: [-.4, -.75, .4, .4],
  pikeDown: [-.4, -4.45, .4, .8], pikeDown2: [-.45, -4.45, .4, .8], pikeUp: [-.4, -.5, .4, .4],
  lance: [-.45, -2.85, .45, 1.4], barded: [-.45, -2.85, .45, 1.4]};
// поза бойца по шеренге: пики опущены в первых четырёх, копья — в первых двух
function poseOf(look, rank){
  if(look === "pike") return rank >= 4 ? "pikeUp" : rank % 2 ? "pikeDown2" : "pikeDown";
  if(look === "spear" || look === "militia") return rank >= 2 ? look + "Up" : look;
  return look;
}
function hash(a, b){ let x = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); x ^= x >>> 15; x = Math.imul(x, 0x2c1b3c6d); x ^= x >>> 12; return (x >>> 0) / 4294967296; }

function ell(g, x, y, rx, ry, fill, rot = 0, stroke = true){
  g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
  if(fill){ g.fillStyle = fill; g.fill(); }
  if(stroke){ g.strokeStyle = INK; g.lineWidth = 0.04; g.stroke(); }
}
function stick(g, x0, y0, x1, y1, width, color){
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.strokeStyle = INK; g.lineWidth = width + 0.04; g.stroke();
  g.strokeStyle = color; g.lineWidth = width; g.stroke();
}
function tip(g, x, y, len){ g.beginPath(); g.moveTo(x - 0.045, y); g.lineTo(x, y - len); g.lineTo(x + 0.045, y); g.closePath(); g.fillStyle = SHINE; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.025; g.stroke(); }
// шлем; в облике В5 — с кольцом (край шлема), как у Iron Kings
function helmet(g, v){
  ell(g, 0, 0, 0.12, 0.12, STEEL);
  if(!GREY){ g.beginPath(); g.arc(0, 0, 0.07, 0, 6.283); g.strokeStyle = "#6a6f74"; g.lineWidth = 0.022; g.stroke(); }
  ell(g, -0.035, -0.035, 0.04, 0.04, SHINE, 0, false);
}
// Г7 (переключатель «серые фигурки»): одежда серая с оттенком цвета отряда. В5 (по умолчанию): всё тело в цвете
// стороны — плечи «пилюлей» со складками рукавов, щит светлее тела, наплечники стальные
let TINT = null, VAR = 0, GREY = false;
function mix(a, b, k){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
const shade = (hex, k) => k >= 0 ? mix(hex, "#ffffff", k) : mix(hex, "#000000", -k);
const shieldCol = col => GREY ? col : shade(col, 0.32);
const padCol = col => GREY ? col : STEEL;
function shoulders(g, fill){
  if(GREY || !TINT){ ell(g, 0, 0.02, 0.27, 0.14, TINT ? mix(fill, TINT, 0.3) : fill); return; }
  const col = shade(mix(TINT, fill, 0.18), [0, -0.1, 0.07][VAR]);   // ополчение чуть бурее, стрелки чуть зеленее
  g.beginPath(); g.moveTo(-0.14, -0.11); g.lineTo(0.14, -0.11); g.arc(0.14, 0.02, 0.13, -Math.PI / 2, Math.PI / 2);
  g.lineTo(-0.14, 0.15); g.arc(-0.14, 0.02, 0.13, Math.PI / 2, Math.PI * 1.5); g.closePath();
  g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.045; g.stroke();
  g.beginPath();
  for(const s of [-1, 1]) for(const a of [-0.65, 0, 0.65]){
    const c = Math.cos(a), sn = Math.sin(a);
    g.moveTo(s * (0.14 + c * 0.045), 0.02 + sn * 0.045); g.lineTo(s * (0.14 + c * 0.11), 0.02 + sn * 0.11);
  }
  g.strokeStyle = shade(col, -0.42); g.lineWidth = 0.022; g.stroke();
}

const PAINT = {
  militia(g, col, v){ militiaman(g, col, v, true); },
  militiaUp(g, col, v){ militiaman(g, col, v, false); },
  spear(g, col, v){ spearman(g, col, v, true); },
  spearUp(g, col, v){ spearman(g, col, v, false); },
  sword(g, col, v){
    stick(g, 0.24, -0.02, 0.31, -0.72, 0.03, SHINE); stick(g, 0.18, -0.05, 0.3, -0.07, 0.03, WOOD);   // клинок и гарда
    shoulders(g, CLOTH[v]);
    ell(g, 0.22, 0.02, 0.075, 0.075, padCol(col)); ell(g, -0.22, 0.02, 0.075, 0.075, padCol(col));   // наплечники
    ell(g, -0.06, -0.21, 0.26, 0.09, shieldCol(col), -0.12); ell(g, -0.06, -0.21, 0.035, 0.035, SHINE);   // большой щит

  },
  pikeDown(g, col, v){ pikeman(g, col, v, 0.12); },
  pikeDown2(g, col, v){ pikeman(g, col, v, -0.3); },     // чётные шеренги — пика слева: ёж из пик, а не одна линия
  pikeUp(g, col, v){
    shoulders(g, CLOTH[v]);
    ell(g, 0.22, 0.02, 0.07, 0.07, padCol(col)); ell(g, -0.22, 0.02, 0.07, 0.07, padCol(col));
    helmet(g, v);
    stick(g, 0.14, -0.02, 0.17, -0.34, 0.04, WOOD); ell(g, 0.17, -0.36, 0.035, 0.035, SHINE);   // пика стоймя — видна торцом
  },
  bow(g, col, v){
    g.fillStyle = "#8a6a45"; g.strokeStyle = INK; g.lineWidth = 0.03;                           // колчан за спиной
    g.beginPath(); g.rect(0.1, 0.08, 0.12, 0.26); g.fill(); g.stroke();
    ell(g, 0.13, 0.08, 0.025, 0.025, "#f1ede4", 0, false); ell(g, 0.19, 0.09, 0.025, 0.025, "#f1ede4", 0, false);
    shoulders(g, ["#c4c3b0", "#bdbca8", "#cccbb9"][v]);
    g.beginPath(); g.moveTo(-0.3, -0.17); g.quadraticCurveTo(0, -0.55, 0.3, -0.17);               // лук
    g.strokeStyle = INK; g.lineWidth = 0.075; g.stroke(); g.strokeStyle = WOOD; g.lineWidth = 0.045; g.stroke();
    g.beginPath(); g.moveTo(-0.3, -0.17); g.lineTo(0.3, -0.17); g.strokeStyle = "#efe9dc"; g.lineWidth = 0.015; g.stroke();
    stick(g, 0, -0.08, 0, -0.5, 0.015, "#efe9dc");                                               // стрела на тетиве
    ell(g, 0, 0, 0.12, 0.12, GREY ? col : shade(col, -0.18)); ell(g, 0, 0.035, 0.07, 0.06, "#00000022", 0, false);   // капюшон цвета отряда
  },
  crossbow(g, col, v){
    g.fillStyle = shieldCol(col); g.strokeStyle = INK; g.lineWidth = 0.035;                       // павеза за спиной
    g.beginPath(); g.rect(-0.28, 0.13, 0.56, 0.17); g.fill(); g.stroke();
    shoulders(g, CLOTH[v]);
    stick(g, 0.04, 0.02, 0.04, -0.55, 0.06, WOOD);                                               // ложе
    g.beginPath(); g.moveTo(-0.24, -0.47); g.quadraticCurveTo(0.04, -0.62, 0.32, -0.47);          // дуга
    g.strokeStyle = INK; g.lineWidth = 0.07; g.stroke(); g.strokeStyle = STEEL; g.lineWidth = 0.04; g.stroke();
    helmet(g, v);

  lance(g, col, v){ horseman(g, col, v, false); },
  barded(g, col, v){ horseman(g, col, v, true); },

// Копьё: передние две шеренги держат его вперёд, задние — стоймя (видно торцом), иначе строй — частокол
function spearOf(g, down){
  if(down){ stick(g, 0.2, 0.3, 0.2, -1.25, 0.035, WOOD); tip(g, 0.2, -1.25, 0.18); }
}
function spearUpOf(g, down){
  if(!down){ stick(g, 0.2, -0.02, 0.23, -0.3, 0.035, WOOD); ell(g, 0.23, -0.32, 0.03, 0.03, SHINE); }
}
function militiaman(g, col, v, down){
  spearOf(g, down);

  if(GREY) ell(g, -0.21, 0.02, 0.07, 0.07, col);                             // повязка цвета отряда на плече
  ell(g, 0, 0, 0.115, 0.115, HAIR[v]);                                       // без шлема
  spearUpOf(g, down);
}
function spearman(g, col, v, down){
  spearOf(g, down);
  shoulders(g, CLOTH[v]);
  ell(g, -0.12, -0.25, 0.22, 0.065, shieldCol(col), -0.18); ell(g, -0.12, -0.25, 0.03, 0.03, SHINE);   // щит перед грудью, с умбоном
  helmet(g, v);

}
function pikeman(g, col, v, px){

  shoulders(g, CLOTH[v]);
  ell(g, 0.22, 0.02, 0.07, 0.07, padCol(col)); ell(g, -0.22, 0.02, 0.07, 0.07, padCol(col));
  helmet(g, v);
}

// Всадник: конь сверху — вытянутое тело, шея с головой вперёд, хвост; попона или полная броня коня — цвет отряда
// В5: конь стройнее, масти — белая, вороная, гнедая, рыжая, серая, буланая; голова сужается к морде, хвост прядями
const HORSE_B5 = ["#e4dfd3", "#3b332d", "#7b4b2c", "#985c30", "#8f8a84", "#b9955f"];
function horseman(g, col, v, barded){
  if(!GREY) return horseB5(g, col, v, barded);
  const hc = HORSE[v * 2 % HORSE.length];
  g.beginPath(); g.moveTo(0, 0.88); g.quadraticCurveTo(0.08, 1.1, 0.03, 1.32);                    // хвост
  g.strokeStyle = INK; g.lineWidth = 0.12; g.stroke(); g.strokeStyle = "#2a211b"; g.lineWidth = 0.08; g.stroke();
  ell(g, 0, 0.1, 0.27, 0.85, hc);                                                                // туловище
  ell(g, 0, -0.86, 0.11, 0.32, barded ? STEEL : hc);                                             // шея и голова
  ell(g, -0.06, -1.15, 0.03, 0.05, barded ? STEEL : hc); ell(g, 0.06, -1.15, 0.03, 0.05, barded ? STEEL : hc);   // уши
  if(!barded) stick(g, 0, -0.62, 0, -1.02, 0.05, "#2a211b");                                    // грива
  if(barded){ ell(g, 0, 0.12, 0.31, 0.78, col); ell(g, 0, 0.12, 0.2, 0.62, "#ffffff22", 0, false); }
  else ell(g, 0, 0.08, 0.31, 0.38, col);                                                         // попона под седлом
  stick(g, 0.2, 0.55, 0.2, -2.6, 0.04, WOOD); tip(g, 0.2, -2.6, 0.2);                           // копьё
  g.beginPath(); g.moveTo(0.22, -2.3); g.lineTo(0.42, -2.22); g.lineTo(0.22, -2.12); g.closePath(); // флажок
  g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.02; g.stroke();
  ell(g, 0, 0, 0.25, 0.13, mix(CLOTH[v], col, 0.3));                                            // всадник
  ell(g, -0.23, -0.03, 0.06, 0.15, col);                                                         // щит
  helmet(g, v);
}
function horseB5(g, col, v, barded){
  const hc = HORSE_B5[(v * 2 + (barded ? 1 : 0)) % HORSE_B5.length], dark = shade(hc, -0.4);
  g.beginPath(); for(const s of [-1, 0, 1]){ g.moveTo(s * 0.03, 0.84); g.quadraticCurveTo(s * 0.09, 1.06, s * 0.06 + 0.02, 1.3); }   // хвост
  g.strokeStyle = INK; g.lineWidth = 0.075; g.stroke(); g.strokeStyle = dark; g.lineWidth = 0.04; g.stroke();
  ell(g, 0, 0.12, 0.22, 0.8, hc);                                                                // туловище
  g.beginPath(); g.moveTo(-0.1, -0.5); g.quadraticCurveTo(-0.13, -0.9, -0.065, -1.2);             // шея и голова
  g.quadraticCurveTo(0, -1.28, 0.065, -1.2); g.quadraticCurveTo(0.13, -0.9, 0.1, -0.5); g.closePath();
  g.fillStyle = barded ? STEEL : hc; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.04; g.stroke();
  ell(g, -0.06, -0.98, 0.025, 0.05, barded ? STEEL : hc); ell(g, 0.06, -0.98, 0.025, 0.05, barded ? STEEL : hc);   // уши
  if(!barded) stick(g, 0, -0.48, 0, -0.94, 0.04, dark);                                           // грива
  if(barded){ ell(g, 0, 0.14, 0.26, 0.74, col); ell(g, 0, 0.14, 0.2, 0.66, shade(col, 0.12), 0, false); }   // попона до копыт
  else ell(g, 0, 0.08, 0.27, 0.34, shade(col, -0.15));                                            // чепрак под седлом
  stick(g, 0.2, 0.55, 0.2, -2.6, 0.04, WOOD); tip(g, 0.2, -2.6, 0.2);                            // копьё
  g.beginPath(); g.moveTo(0.22, -2.3); g.lineTo(0.42, -2.22); g.lineTo(0.22, -2.12); g.closePath(); // флажок
  g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 0.02; g.stroke();
  shoulders(g, CLOTH[v]);                                                                          // всадник
  ell(g, -0.24, -0.03, 0.065, 0.16, shieldCol(col));                                              // щит
  helmet(g, v);
}

const SPR = new Map();
function sprite(look, col, v){
  const q = Math.pow(1.2, Math.round(Math.log(view.s) / Math.log(1.2)));   // приближение ступеньками — меньше перерисовок
  const key = `${look}|${col}|${v}|${q.toFixed(3)}|${GREY ? 1 : 0}`;
  let sp = SPR.get(key);
  if(sp) return sp;
  const [x0, y0, x1, y1] = BOX[look], k = Math.min(q, 90) * (window.devicePixelRatio || 1);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil((x1 - x0) * k)); c.height = Math.max(1, Math.ceil((y1 - y0) * k));
  const g = c.getContext("2d");
  g.scale(k, k); g.translate(-x0, -y0); g.lineJoin = "round"; g.lineCap = "round";
  TINT = col; VAR = v; PAINT[look](g, col, v); TINT = null;
  if(SPR.size > 600) SPR.clear();
  sp = {c, x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  SPR.set(key, sp);
  return sp;
}

// Фигурка: бойцы по сетке pm × rd, спереди назад; в неполном ряду — по центру
// мягкая тень под бойцом (В5): пятно, растянутое под пешего или коня
const SHADOW = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 32;
  const g = c.getContext("2d"), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, "rgba(24,18,8,.42)"); gr.addColorStop(0.6, "rgba(24,18,8,.22)"); gr.addColorStop(1, "rgba(24,18,8,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  return c;
})();
function drawMen(u, [w, d, men, rank], fx, fy, h, col, moving, t, k){
  const pm = u.pm || 1, rd = u.rd || 1, look = lookOf(u), horse = look === "lance" || look === "barded";
  const cols = Math.max(1, Math.round(w / pm)), rows = Math.max(1, Math.round(d / rd));
  if(!u.fd) u.fd = Math.max(...u.figs.map(q => Math.round(q[1] / rd)));
  ctx.save(); ctx.translate(X(fx), Y(fy)); ctx.rotate(h); ctx.scale(view.s, view.s);
  const men1 = [];   // [x, y, поза, вариант]
  let left = Math.round(men ?? cols * rows);
  for(let j = 0; j < rows && left > 0; j++){
    const n = Math.min(cols, left), off = (cols - n) / 2; left -= n;
    const manRank = (rank ?? 0) * u.fd + j;
    const pose = poseOf(look, manRank);
    for(let i = 0; i < n; i++){
      const seed = u.id * 7919 + k * 64 + j * 8 + i;
      const r1 = hash(seed, 1), r2 = hash(seed, 2), r3 = hash(seed, 3);
      let x = -w / 2 + (off + i + 0.5) * pm + (r1 - 0.5) * 0.12 * pm;
      let y = -d / 2 + (j + 0.5) * rd + (r2 - 0.5) * 0.12 * rd;
      if(moving){ const ph = r3 * 6.283; y += Math.sin(t * 11 + ph) * 0.05; x += Math.cos(t * 5.5 + ph) * 0.025; }
      men1.push([x, y, pose, Math.floor(r3 * 3)]);
    }
  }
  // тени — до бойцов, чтобы не ложились на соседа; смещение влево вниз в мире, в осях строя — повёрнуто обратно
  if(view.s >= 5){
    const so = horse ? 0.45 : 0.2, wx = SH_X * so, wy = SH_Y * so, ch = Math.cos(h), sh = Math.sin(h);
    const lx = wx * ch + wy * sh, ly = -wx * sh + wy * ch, sw = horse ? 0.66 : 0.66, shh = horse ? 2.0 : 0.48, sy = horse ? 0.12 : 0.02;
    for(const [x, y] of men1) ctx.drawImage(SHADOW, x + lx - sw / 2, y + sy + ly - shh / 2, sw, shh);
  }
  for(const [x, y, pose, v] of men1){ const sp = sprite(pose, col, v); ctx.drawImage(sp.c, x + sp.x, y + sp.y, sp.w, sp.h); }
  ctx.restore();
}

// ── павшие и кровь (Г67; по мотивам «hit visuals» автора Iron Kings — рисунок свой) ──
// Под павшим — лужа (три неровных пятна, растекается за ~1 с), брызги — по направлению удара, за спину.
// Сам павший — тот же боец, обесцвеченный в цвет своей стороны, лежит, как упал. Удар в голову — кровь на голове.
const BLOOD = "#7b1212";   // смешение цветов mix() — выше, у одежды бойцов
function drawDead(){
  if(!S.dead) return;
  const now = frame, near = view.s >= MEN_FROM;
  ctx.fillStyle = BLOOD;
  for(const [x, y, fi, ui, fc, dir, part] of S.dead){
    if(fi > now) continue;
    const px = X(x), py = Y(y);
    if(!near){ ctx.fillRect(px - 0.8, py - 0.8, 1.6, 1.6); continue; }
    const seed = (fi * 131 + ui * 7919 + Math.round(x * 13) + Math.round(y * 7)) | 0;
    const g = Math.min(1, 0.25 + (now - fi) * S.dt / 1.2), a = dir * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const big = part === 3 ? 1.7 : part === 0 ? 0.65 : part === 2 ? 0.85 : 1;
    for(let k = 0; k < 3; k++){
      const r = (0.15 + 0.13 * hash(seed, k)) * big * g * view.s, off = (0.1 + 0.25 * hash(seed, k + 7)) * g;   // лужа — с тело бойца, не больше
      const ox = (ca * off + (hash(seed, k + 3) - 0.5) * 0.3) * view.s, oy = (sa * off + (hash(seed, k + 5) - 0.5) * 0.3) * view.s;
      ctx.beginPath(); ctx.ellipse(px + ox, py + oy, r, r * (0.65 + 0.35 * hash(seed, k + 9)), a, 0, 6.283); ctx.fill();
    }
    const n = 2 + Math.floor(hash(seed, 11) * 4);
    for(let k = 0; k < n; k++){
      const d = (0.55 + 1.3 * hash(seed, 20 + k)) * g, sp = (hash(seed, 30 + k) - 0.5) * 0.8;
      ctx.beginPath(); ctx.arc(px + Math.cos(a + sp) * d * view.s, py + Math.sin(a + sp) * d * view.s, Math.max(0.6, (0.05 + 0.08 * hash(seed, 40 + k)) * view.s), 0, 6.283); ctx.fill();
    }
  }
  if(!near) return;
  for(const [x, y, fi, ui, fc, dir, part] of S.dead){
    if(fi > now) continue;
    const u = S.units[ui], col = mix(u.col, "#8b8781", 0.7), sp = sprite(poseOf(lookOf(u), 0), col, 0);
    ctx.save(); ctx.translate(X(x), Y(y)); ctx.rotate(fc * Math.PI / 180); ctx.scale(view.s, view.s); ctx.globalAlpha = 0.85;
    ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h);
    if(part === 0){ ctx.globalAlpha = 1; ctx.fillStyle = BLOOD; ctx.beginPath(); ctx.arc(0, 0, 0.13, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
}

// Знамя отряда (Г7): в центре строя, ближе к первой шеренге; рисуется в пикселях — видно с любого приближения
function drawBanner(f, h, depth, col){
  const bx = X(f[0] + Math.sin(h) * depth * 0.2), by = Y(f[1] - Math.cos(h) * depth * 0.2);
  const s = Math.min(1.6, Math.max(0.8, view.s / 12));
  ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -26); ctx.stroke();
  ctx.strokeStyle = WOOD; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(17, -25); ctx.lineTo(13, -19.5); ctx.lineTo(17, -14); ctx.lineTo(0, -14); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(1.5, -21, 9, 2.2);
  ctx.restore();
}

function drawFlow(u){
  if(!u || !u.flow) return;
  const cw = S.w / S.cols, ch = S.h / S.rows, step = Math.max(1, Math.round(16 / (cw * view.s)));
  ctx.strokeStyle = "rgba(30,30,30,.45)"; ctx.lineWidth = 1;
  for(let y = Math.floor(step / 2); y < S.rows; y += step) for(let x = Math.floor(step / 2); x < S.cols; x += step){
    const c = u.flow[y * S.cols + x];
    if(c === "." || c === "T") continue;
    const k = c.charCodeAt(0) - 48, dx = DX[k], dy = DY[k], l = Math.hypot(dx * cw, dy * ch);
    const cx = X((x + 0.5) * cw), cy = Y((y + 0.5) * ch), L = Math.min(7, step * cw * view.s * 0.4), ux = dx * cw / l, uy = dy * ch / l;
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L);
    ctx.lineTo(cx + ux * L - (ux * 3 - uy * 2.5), cy + uy * L - (uy * 3 + ux * 2.5));
    ctx.moveTo(cx + ux * L, cy + uy * L); ctx.lineTo(cx + ux * L - (ux * 3 + uy * 2.5), cy + uy * L - (uy * 3 - ux * 2.5));
    ctx.stroke();
  }
}

// места в строю: по раскладке фигурок вокруг центра (сетка, как Formation.Layout) — пунктирный контур строя
function drawSlots(u, f, col){
  const h = f[2] * Math.PI / 180, c = Math.cos(h), s = Math.sin(h), fw = u.front / 2, dd = u.depth / 2;
  const pts = [[-fw, -dd], [fw, -dd], [fw, dd], [-fw, dd]].map(([lx, ly]) => [f[0] + lx * c - ly * s, f[1] + lx * s + ly * c]);
  ctx.setLineDash([3, 3]); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}

function showLog(time){
  const done = Math.min(S.turns, Math.floor(time / S.turnSec + 1e-9));
  let html = "";
  for(let t = 0; t < done; t++) html += `<p><b>Ход ${t + 1}</b></p>` + S.logs[t].map(l => `<p>${esc(l)}</p>`).join("");
  if(!done) html = `<p class="note">Строки журнала появятся в конце хода.</p>`;
  if($("log").dataset.n !== String(done)){ $("log").innerHTML = html; $("log").dataset.n = done; }
}
function showUnits(fr){
  $("units").innerHTML = S.units.map((u, i) => {
    const v = fr[i][3], kind = {infantry:"пехота", pike:"пикинёры", archer:"стрелки", cavalry:"конница"}[u.type] || u.type;
    const now = S.soldiers ? S.soldiers[Math.min(S.soldiers.length - 1, Math.round(frame))][i] : null;
    return `<div class="unit${i === sel ? " sel" : ""}" data-i="${i}"><span class="sw" style="background:${u.col}"></span>
      <span>${esc(u.name)}</span><small>${kind}, ${now !== null ? `в строю ${now} из ${u.men}` : `${u.men} чел.`}, фронт ${u.front} × ${u.depth} м · норма ${u.norm} м · сейчас ${(v).toFixed(1).replace(".", ",")} м нормы/с${u.note ? " · " + esc(u.note) : ""}</small></div>`;
  }).join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(i){
  S = DATA.scenes[i]; sel = 0; frame = 0; playing = false; $("play").textContent = "▶";
  $("note").textContent = S.note;
  $("slider").max = S.frames.length - 1;
  $("log").dataset.n = "";
  document.querySelectorAll("#tabs button").forEach((b, k) => b.classList.toggle("on", k === i));
  S.units.forEach((u, k) => u.col = sideColor(k));
  prepMap(); TILES.clear(); want = []; makeOverview(); fit(); draw();
}

let last = 0;
function tick(ts){
  const grow = want.length > 0;
  if(grow) growTiles();   // плитки земли дорисовываются понемногу, пока картинка не станет чёткой
  if(playing){
    const dt = last ? (ts - last) / 1000 : 0;
    frame = Math.min(S.frames.length - 1, frame + dt * speed / S.dt);
    if(frame >= S.frames.length - 1){ playing = false; $("play").textContent = "▶"; }
  }
  if(playing || grow) draw();
  last = ts; requestAnimationFrame(tick);
}

if(!DATA){
  document.body.innerHTML = `<p style="padding:24px">Нет данных. Запусти из папки core: <code>dotnet run --project Tests -- polygon</code> и открой core/polygon/polygon.html.</p>`;
} else {
  $("tabs").innerHTML = DATA.scenes.map((s, i) => `<button>${esc(s.name)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b, i) => b.onclick = () => load(i));
  $("made").textContent = "Записано: " + DATA.made;
  $("play").onclick = () => { if(frame >= S.frames.length - 1) frame = 0; playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; };
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
    speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("slider").oninput = e => { frame = +e.target.value; draw(); };
  ["showMen", "showRoute", "showFlow", "showSlots"].forEach(id => $(id).onchange = draw);
  $("showGrid").onchange = e => { SHOW_GRID = e.target.checked; TILES.clear(); want = []; makeOverview(); draw(); };
  $("greyMen").onchange = e => { GREY = e.target.checked; SPR.clear(); draw(); };
  $("units").onclick = e => { const el = e.target.closest(".unit"); if(el){ sel = +el.dataset.i; draw(); } };
  addEventListener("keydown", e => {
    if(e.code === "Space"){ e.preventDefault(); $("play").click(); }
    if(e.code === "ArrowRight"){ frame = Math.min(S.frames.length - 1, Math.floor(frame) + 1); draw(); }
    if(e.code === "ArrowLeft"){ frame = Math.max(0, Math.ceil(frame) - 1); draw(); }
  });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    view.ox = mx - (mx - view.ox) * k; view.oy = my - (my - view.oy) * k; view.s *= k; draw();
  }, {passive: false});
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy}; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(drag){ view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y; draw(); } });
  cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("dblclick", () => { fit(); draw(); });
  addEventListener("resize", () => { fit(); draw(); });
  load(0);
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
