<!doctype html>
<meta charset="utf-8">
<title>Стоящие бойцы</title>
<!-- Стоящие бойцы (В17): косой вид — земля сверху, фигурка стоит. Рисует figure() из polygon-men.js — те же части и
     сборка, что у Unity. Смотреть: node game/Tools/art-server.mjs → http://localhost:8790/men-oblique.html
     ?s=110 — px на метр; ?kit=spear,sword — только эти наборы; ?pose=rest|low|walk|atk — поза; ?side=#b0302a;
     ?k=2 — пикселей на точку; ?shot=имя — снимок в game/Assets/_Shots -->
<style>body { margin: 0; background: #23201b; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script src="polygon-men.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if(Q.get("k")) Object.defineProperty(window, "devicePixelRatio", {get: () => +Q.get("k")});
const view = {s: +Q.get("s") || 110};
let ctx;
const SIDE = Q.get("side") || "#b0302a", POSE = Q.get("pose") || "rest";
const ALL = [["militia", "militia", "Ополчение"], ["spear", "infantry", "Копейщики"], ["sword", "guard", "Мечники"],
             ["pike", "pikemen", "Пикинёры"], ["bow", "archers", "Лучники"], ["crossbow", "crossbowmen", "Арбалетчики"]];
const KITS = Q.get("kit") ? ALL.filter(k => Q.get("kit").split(",").includes(k[0])) : ALL;
const FACES = [0, 0.785, 1.571, 2.356, 3.1416, 4.712];
const S = view.s, ROW = 2.35 * S, COL = 1.15 * S, dpr = window.devicePixelRatio || 1;
const c = document.getElementById("c"), W = Math.max(innerWidth, 130 + FACES.length * COL), H = 40 + KITS.length * ROW;
c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
ctx = c.getContext("2d"); setZoom();
ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#6f7a45"; ctx.fillRect(0, 0, W, H);
for(let i = 0; i < 4000; i++){ ctx.fillStyle = hash(i, 3) < 0.5 ? "rgba(60,70,30,.25)" : "rgba(150,150,90,.18)"; ctx.fillRect(hash(i, 1) * W, hash(i, 2) * H, 2, 2); }
KITS.forEach(([look, tpl, name], r) => {
  const y0 = 40 + r * ROW + 1.95 * S, kits = kitsOf({id: 300 + r * 17, col: SIDE, tpl});
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#f0e6c8"; ctx.font = "bold 14px system-ui"; ctx.fillText(name, 10, y0 - 1.6 * S);
  FACES.forEach((f, i) => {
    const k = kits[i % kits.length], X = 130 + (i + 0.5) * COL, B = [S * dpr, 0, 0, S * dpr, X * dpr, y0 * dpr];
    const P = restPose(k, 0, POSE === "low" ? 1 : 0), t = i * 0.37;
    const o = {W: P.W, Sh: P.Sh, step: POSE === "walk" ? Math.sin(t * 6.283) : 0};
    if(POSE === "atk" && P.W){ const ap = 0.3 + 0.12 * i; const [r2, sy2] = swingAng(ap); o.W = THRUST.has(k.weapon) ? [P.W[0], P.W[1] - 0.1 + thrustOff(ap), 0, 1, 1] : [0.22, -0.08, r2, 1, sy2]; }
    // тень на земле — от света справа сверху влево вниз
    ctx.setTransform(B[0], 0, 0, B[3], B[4], B[5]); ctx.drawImage(SHADOW, -0.55, -0.3, 0.9, 0.6);
    drawFigure(figure(k, 0, 0, f, o), B);
  });
});
if(Q.get("shot")) c.toBlob(b => fetch("/shot?file=" + encodeURIComponent(Q.get("shot")) + ".png", {method: "POST", body: b}).then(r => r.text()).then(t => document.title = "снимок: " + t));
</script>
