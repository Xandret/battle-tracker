const Q = new URLSearchParams(location.search);
if(Q.get("k")) Object.defineProperty(window, "devicePixelRatio", {get: () => +Q.get("k")});
const view = {s: 10};

const RED = "#c8463a", BLUE = "#3f78c0", PAPER = Q.get("bg") === "paper", W = Math.max(innerWidth, 1400), H = 5320;

c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";

function world(ox, oy, s){ view.s = s; setZoom(); g.setTransform(s * dpr, 0, 0, s * dpr, ox * dpr, oy * dpr); g.lineJoin = "round"; g.lineCap = "round"; return [s * dpr, 0, 0, s * dpr, ox * dpr, oy * dpr]; }

  if(!PAPER) for(let i = 0; i < 9000; i++){ const x = hash(i, 1) * W, y = hash(i, 2) * H; g.fillStyle = hash(i, 3) < 0.5 ? "rgba(60,70,30,.22)" : "rgba(190,190,120,.16)"; g.fillRect(x, y, 2, 2); }
}
// площадка земли (двор, площадь, мостовая) с зерном и мягким краем
function patch(pts, col, cobble){
  bPoly(g, pts); g.fillStyle = col; g.fill(); bGrain(g, 0.5);
  if(cobble){ g.save(); bPoly(g, pts); g.clip(); const S = []; const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    for(let y = Math.min(...ys); y < Math.max(...ys); y += 0.7){ S.push([Math.min(...xs), y, Math.max(...xs), y]); for(let x = Math.min(...xs) + (Math.round(y / 0.7) % 2) * 0.45; x < Math.max(...xs); x += 0.9) S.push([x, y, x, y + 0.7]); }

}
const UNITS = new Map();
function kitsFor(tpl, col, style = "west", id = 1){ const key = tpl + col + style + id; if(!UNITS.has(key)) UNITS.set(key, {id, col, tpl, style}); return kitsF(UNITS.get(key)); }

function fManUp(B, x, y, z, face, k, o = {}){ const q = bUp(z); fMan(mS(B, q, q), x / q, y / q, face, k, o); }

    for(let i = 0; i < 18; i++){ const x = 8.6 + i * 0.95; if(Math.abs(x - 27.5) < 2.2 || lad.some(L => Math.abs(x - L.x) < 1.2)) continue; fManUp(B, x, 9.25, WZ, Math.PI, rk(i), {low: 0}); }
    lad.forEach((L, li) => [-1, 1].forEach((sd, q) => { const k = rk(20 + li * 2 + q); fManUp(B, L.x + sd * 0.78, walkY - 0.15, WZ, Math.PI + sd * 0.9, k, fight(k, li * 0.4 + q * 0.5 + 0.1)); }));
    for(let i = 0; i < 12; i++){ const x = 9.0 + i * 1.3; if(Math.abs(x - 27.5) < 2.2) continue; fManUp(B, x, 8.2, WZ, Math.PI, red[(i + 7) % red.length], {low: 0}); }
    [[26.7, 9.7], [28.3, 9.6], [27.5, 10.9]].forEach(([x, yy], i) => fManUp(B, x, yy, WZ + 0.5, 0, bk(23 + i), i < 2 ? fight(bk(23 + i), i * 0.4) : {low: 0}));
    [[26.7, 8.4], [28.3, 8.3]].forEach(([x, yy], i) => fManUp(B, x, yy, WZ, Math.PI, rk(3 + i), fight(rk(3 + i), i * 0.4 + 0.15)));
    // на открытой площадке башни — арбалетчики
    [[2.6, 9.6, 2.6], [5.4, 10.2, 3.3], [4.0, 6.0, 0.9]].forEach(([x, yy, f], i) => fManUp(B, x, yy, 12, f, xbow[i], {low: 0, xb: Math.floor(t * 0.7 + i * 0.6) % 4}));
    // во дворе — подмога бежит к лестнице
    for(let i = 0; i < 4; i++) fMan(B, 13.6 + i * 0.7, 3.2 - (i % 2) * 0.8, 1.9, red[(i + 11) % red.length], {low: 0, step: Math.sin(t * 9 + i)});
    world(ox, oy, s);
    g.restore();
    y += (SH + 1) * s;
  }
  // ── 6. Кровли и шатры вблизи ──
  label("Вблизи (40 px/м): кровли четырёх видов, шатёр и палатка, костёр", 20, y); y += 14;
  {
    const ox = 20, oy = y + 10, s = 40; world(ox, oy, s);
    const kinds = ["tile", "slate", "thatch", "shingle"];
    kinds.forEach((k, i) => bHouse(g, 1 + i * 4.6, 1.5, 1 + i * 4.6 + 3.8, 6.5, {roof: k, seed: 9970 + i, chimney: i !== 2}));
    bBellTent(g, 22, 4, 2.4, RED, {door: 1.2, seed: 9980});
    bRidgeTent(g, 28.5, 4, 0, 2.4, 3.4, {col: RED, seed: 9981});
    bFire(g, 32.5, 4, t, 9982);
    y += 9 * s;
  }
  // ── 7. Мельница ──
  label("Мельница (25 px/м): башня с галереей, шатёр к ветру, крылья строго сверху — узкой полосой перед шатром, крест — в тени на земле; водило с колесом ворота", 20, y); y += 14;
  {
    const ox = 20, oy = y + 10, s = 25; world(ox, oy, s);
    bWindmill(g, 16, 13, t, 141, {face: -0.4});
    bWindmill(g, 42, 13, t * 1.1 + 0.7, 151, {face: 2.2});
    y += 27 * s;
  }
}

const T0 = performance.now(), fixed = Q.get("t");
let last = 0;
function loop(now){ if(!fixed && now - last < 70){ requestAnimationFrame(loop); return; } last = now; frame(fixed ? +fixed : (performance.now() - T0) / 1000); if(!fixed) requestAnimationFrame(loop); }
loop(0);
if(Q.get("shot")) c.toBlob(b => fetch("/shot?file=" + encodeURIComponent(Q.get("shot")) + ".png", {method: "POST", body: b})
  .then(r => r.text()).then(tx => document.title = "снимок: " + tx));
</script>
